<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>财务管家</title>
<style>
/* ─── 全局 & Tab 导航 ─── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;overflow:hidden}
#app-root{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
.tab-bar{display:flex;background:#fff;border-top:.5px solid #e8e8e8;flex-shrink:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;background:none}
.tab-btn:active{opacity:.7}
.tab-icon{font-size:20px;margin-bottom:2px;line-height:1}
.tab-label{font-size:10px;font-weight:500;color:#aaa}
.tab-btn.active .tab-label{color:#378ADD;font-weight:700}
.tab-content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.tab-panel{position:absolute;inset:0;overflow:hidden;display:none;flex-direction:column}
.tab-panel.active{display:flex}
/* ─── 记账日记 CSS ─── */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f0f0f5}
.shell{max-width:390px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#f0f0f5}
.quiz-wrap{flex:1;display:flex;flex-direction:column;padding:28px 20px 20px;background:#fff;overflow-y:auto}
.pdots{display:flex;gap:5px;margin-bottom:22px}
.pdot{flex:1;height:4px;border-radius:2px;background:#e0dfd8}
.pdot.done{background:#378ADD}.pdot.active{background:#85B7EB}
.qemoji{font-size:30px;margin-bottom:8px;display:block}
.qtitle{font-size:18px;font-weight:600;color:#1a1a1a;line-height:1.4;margin-bottom:4px}
.qsub{font-size:12px;color:#888;margin-bottom:18px;line-height:1.6}
.qopts{display:flex;flex-direction:column;gap:8px;flex:1}
.qopt{padding:12px 14px;border-radius:14px;border:1.5px solid #e8e8e8;background:#fff;cursor:pointer;text-align:left;transition:all .12s}
.qopt:hover{background:#f5f5f5}
.qopt.sel{border-color:#378ADD;background:#EBF4FF}
.qopt-t{font-size:13px;font-weight:600;color:#1a1a1a}
.qopt.sel .qopt-t{color:#0C447C}
.qopt-s{font-size:11px;color:#999;margin-top:2px}
.qopt.sel .qopt-s{color:#378ADD}
.amtbox{background:#f7f7f7;border:1.5px solid #e8e8e8;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.amtbox:focus-within{border-color:#378ADD}
.amtsym{font-size:18px;font-weight:600;color:#999}
.amtin{flex:1;background:none;border:none;outline:none;font-size:22px;font-weight:600;color:#1a1a1a;-moz-appearance:textfield}
.amtin::-webkit-outer-spin-button,.amtin::-webkit-inner-spin-button{-webkit-appearance:none}
.amtunit{font-size:12px;color:#999}
.tog{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;border:1.5px solid #e8e8e8;background:#f7f7f7;cursor:pointer;margin-bottom:8px;transition:all .12s}
.tog.on{border-color:#378ADD;background:#EBF4FF}
.tog-lbl{font-size:13px;font-weight:500;color:#1a1a1a}
.tog.on .tog-lbl{color:#0C447C}
.togpill{width:34px;height:19px;border-radius:10px;background:#ccc;position:relative;flex-shrink:0;transition:background .2s}
.togpill.on{background:#378ADD}
.togpill::after{content:'';position:absolute;top:2.5px;left:2.5px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.togpill.on::after{transform:translateX(15px)}
.navrow{display:flex;gap:8px;margin-top:16px}
.btnback{flex:0 0 42px;height:42px;border-radius:12px;border:1.5px solid #e8e8e8;background:#f7f7f7;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px}
.btnnext{flex:1;height:42px;border-radius:12px;border:none;background:#378ADD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s}
.btnnext:hover{background:#185FA5}
.btnnext:disabled{background:#ccc;cursor:default}
.sumcard{background:#f7f7f7;border-radius:12px;padding:14px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:0.5px solid #e8e8e8}
.sumrow:last-child{border-bottom:none}
.sumk{font-size:12px;color:#888}
.sumv{font-size:12px;font-weight:600;color:#1a1a1a}
.finbtn{width:100%;height:46px;border-radius:14px;border:none;background:#378ADD;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.app-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.appbar{padding:12px 16px 10px;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #e8e8e8;flex-shrink:0}
.apptitle{font-size:16px;font-weight:700;color:#1a1a1a}
.app-actions{display:flex;gap:6px;align-items:center}
.settbtn{font-size:11px;color:#378ADD;background:none;border:1px solid #a8cdf0;border-radius:8px;padding:4px 10px;cursor:pointer}
.scroll-body{flex:1;overflow-y:auto;padding:10px 10px 0;-webkit-overflow-scrolling:touch}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.card{background:#fff;border-radius:14px;padding:10px 10px 8px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:box-shadow .15s}
.card:active{box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card-title{font-size:11px;font-weight:600;color:#888;letter-spacing:.03em}
.card-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.card-expand{font-size:10px;color:#378ADD}
/* 日历小卡 */
.mini-cal-wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:2px}
.mini-wl{font-size:8px;color:#aaa;text-align:center}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px}
.mcc{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.mcc.emp{background:transparent!important}
.mcd{font-size:9px;font-weight:600;line-height:1}
.mcn{font-size:7px;line-height:1;margin-top:1px}
.cal-footer{display:flex;justify-content:space-between;margin-top:6px;padding-top:5px;border-top:.5px solid #f0f0f0}
.cal-footer-item{text-align:center;flex:1}
.cal-footer-v{font-size:11px;font-weight:600;color:#1a1a1a}
.cal-footer-l{font-size:9px;color:#aaa;margin-top:1px}
/* 预算环形卡 */
.ring-area{display:flex;flex-direction:column;align-items:center}
.ring-canvas-wrap{position:relative;display:inline-block}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.ring-center-pct{font-size:20px;font-weight:800;color:#1a1a1a;line-height:1}
.ring-center-lbl{font-size:8px;color:#aaa;margin-top:1px}
.ring-nums{display:flex;justify-content:space-between;width:100%;margin-top:5px}
.rnum{text-align:center}
.rnum-v{font-size:11px;font-weight:700}
.rnum-l{font-size:9px;color:#aaa;margin-top:1px}
.budget-predict{font-size:9px;color:#aaa;text-align:center;margin-top:4px;padding-top:4px;border-top:.5px solid #f0f0f0;width:100%}
.budget-predict.warn{color:#e65100}
.budget-predict.over{color:#c62828}
/* 报销卡 */
.pie-area{display:flex;flex-direction:column;align-items:center}
.pie-card-wrap{position:relative;display:inline-block}
.pie-card-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.pie-card-lbl{font-size:9px;color:#aaa;line-height:1.4}
.pie-card-val{font-size:13px;font-weight:800;color:#e53935;line-height:1.2}
.pli{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.pld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pll{font-size:9px;color:#888;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pla{font-size:9px;font-weight:600;color:#1a1a1a}
.reimb-stat{display:flex;justify-content:space-around;margin-bottom:5px}
.rs-item{text-align:center}
.rs-v{font-size:12px;font-weight:700}
.rs-l{font-size:9px;color:#aaa;margin-top:1px}
.reimb-mini-row{display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:.5px solid #f0f0f0}
.reimb-mini-row:last-child{border-bottom:none}
.rmr-name{font-size:10px;color:#1a1a1a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmr-name.done{text-decoration:line-through;color:#aaa}
.rmr-amt{font-size:10px;font-weight:600;color:#185FA5}
.rmr-dl{font-size:9px;padding:1px 5px;border-radius:4px;background:#FFF3E0;color:#E65100;flex-shrink:0}
.reimb-footer{margin-top:5px;padding-top:5px;border-top:.5px solid #f0f0f0;font-size:10px;color:#aaa;text-align:center}
.reimb-footer.ok{color:#2e7d32}
/* 流水 */
.feed-section{background:#fff;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.feed-group{}
.feed-dh{display:flex;align-items:center;justify-content:space-between;padding:9px 12px 5px}
.feed-dlbl{font-size:12px;font-weight:600;color:#888}
.feed-dsub{display:flex;gap:8px}
.feed-din{font-size:11px;color:#2e7d32;font-weight:500}
.feed-dout{font-size:11px;color:#c62828;font-weight:500}
.feed-entry{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.feed-entry:active{background:#f9f9f9}
.ficon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fbody{flex:1;min-width:0}
.fname{font-size:13px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.fname.rdone{text-decoration:line-through;color:#aaa}
.fmeta{display:flex;gap:5px;align-items:center;margin-top:2px}
.ftag{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:500}
.ftime{font-size:10px;color:#bbb}
.famt{font-size:14px;font-weight:700;flex-shrink:0}
.famt.out{color:#c62828}.famt.in{color:#2e7d32}.famt.reimb{color:#185FA5}
.fdone-lbl{font-size:9px;color:#aaa;flex-shrink:0}
.empty-feed{text-align:center;color:#bbb;font-size:12px;padding:24px 0}
/* 输入框 */
.input-bar{background:#fff;border-top:.5px solid #e8e8e8;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex-shrink:0}
.qinput{flex:1;height:36px;background:#f5f5f5;border:1px solid #e8e8e8;border-radius:18px;padding:0 14px;font-size:13px;color:#1a1a1a;outline:none;transition:border-color .15s}
.qinput:focus{border-color:#378ADD;background:#fff}
.qinput::placeholder{color:#bbb}
.addbtn{width:36px;height:36px;border-radius:50%;background:#378ADD;border:none;cursor:pointer;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(55,138,221,.4);-webkit-tap-highlight-color:transparent}
/* 提示 */
.input-hint{font-size:11px;padding:2px 14px 0;height:16px;transition:color .15s}
.input-hint.income{color:#2e7d32}
.input-hint.expense{color:#aaa}
.toast{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);background:rgba(20,20,20,.86);color:#fff;font-size:12px;padding:8px 14px;border-radius:18px;z-index:160;white-space:nowrap;pointer-events:none}
/* 详情页 */
.detail-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#f0f0f5}
.detail-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:.5px solid #e8e8e8;flex-shrink:0}
.back-btn{width:32px;height:32px;border-radius:9px;border:1px solid #e8e8e8;background:#f7f7f7;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;-webkit-tap-highlight-color:transparent}
.detail-title{font-size:15px;font-weight:700;color:#1a1a1a}
.detail-body{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
/* 大日历 */
.big-cal-wrow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.big-wl{font-size:11px;color:#aaa;text-align:center;padding:2px 0}
.big-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px}
.bcc{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bcc.emp{background:transparent!important}
.bcd{font-size:14px;font-weight:600;line-height:1}
.bcn{font-size:9px;line-height:1;margin-top:2px}
.day-feed-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.day-feed-lbl{font-size:13px;font-weight:600;color:#1a1a1a}
.day-feed-sub{display:flex;gap:8px}
.big-entry{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;background:#fff;margin-bottom:4px;-webkit-tap-highlight-color:transparent}
.big-entry:active{background:#f5f5f5}
/* 详情统计 */
.d-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.d-stat{background:#fff;border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d-stat-v{font-size:16px;font-weight:700}
.d-stat-l{font-size:10px;color:#aaa;margin-top:3px}
.d-stat-sub{font-size:10px;color:#aaa;margin-top:2px}
.prog-wrap{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:6px}
.prog-bar-bg{height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.breakdown{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bdrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid #f0f0f0}
.bdrow:last-child{border-bottom:none}
.bdk{font-size:12px;color:#888}
.bdv{font-size:12px;font-weight:600;color:#1a1a1a}
/* 饼图详情 */
.d-pie-list{display:flex;flex-direction:column;gap:7px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d-pie-row{display:flex;align-items:center;gap:8px}
.d-pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.d-pie-lbl{font-size:13px;color:#1a1a1a;flex:1}
.d-pie-bar-bg{width:60px;height:5px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.d-pie-bar{height:100%;border-radius:3px}
.d-pie-amt{font-size:12px;font-weight:600;color:#1a1a1a;min-width:48px;text-align:right}
.d-pie-pct{font-size:10px;color:#aaa;min-width:26px;text-align:right}
.d-pie-sub{font-size:9px;color:#bbb;min-width:52px;text-align:right}
/* 支出分类下钻 */
.pie-mode-row{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
.pie-mode-btn{font-size:13px;font-weight:700;border:none;border-radius:16px;padding:5px 16px;background:#f0f0f0;color:#aaa;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pie-mode-btn.sel-out{background:#ffe5e5;color:#e53935}
.pie-mode-btn.sel-in{background:#e6f4ea;color:#2e7d32}
.d-pie-wrap{position:relative;display:flex;justify-content:center;margin-bottom:14px}
/* 交易列表明细页 */
.d-txn-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#888;padding:2px 4px 10px}
.d-txn-sum{font-weight:700;color:#555}
.d-txn-date{font-size:13px;font-weight:700;color:#666;background:#f5f5f7;border-radius:8px;padding:6px 12px;margin:10px 0 6px}
.d-txn-row{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:.5px solid #f2f2f2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.d-txn-time{font-size:11px;color:#aaa;background:#f0f0f0;border-radius:6px;padding:2px 7px;flex-shrink:0}
.d-txn-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.d-txn-mid{flex:1;min-width:0}
.d-txn-tag{display:inline-block;font-size:12px;color:#999;background:#f5f5f7;border-radius:6px;padding:2px 8px}
.d-txn-note{font-size:12px;color:#666;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-txn-amt{font-size:15px;font-weight:700;flex-shrink:0}
.d-txn-amt.out{color:#e53935}
.d-txn-amt.in{color:#2e7d32}
.d-cat-list{display:flex;flex-direction:column;gap:10px}
.d-cat-block{background:#fff;border-radius:12px;padding:12px 12px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.d-cat-head{display:flex;align-items:center;gap:9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.d-cat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.d-cat-name{font-size:15px;font-weight:700;color:#1a1a1a;flex-shrink:0}
.d-cat-meta{font-size:12px;color:#aaa;flex:1}
.d-cat-amt{font-size:15px;font-weight:700;color:#1a1a1a}
.d-cat-arrow{font-size:14px;color:#bbb;width:18px;text-align:center;flex-shrink:0;transition:transform .2s}
.d-cat-arrow.open{transform:rotate(180deg)}
.d-cat-barbg{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-top:9px}
.d-cat-bar{height:100%;border-radius:3px;transition:width .4s}
.d-sub-list{margin-top:10px;padding-left:12px;border-left:3px solid #ddd;display:flex;flex-direction:column}
.d-sub-row{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:.5px solid #f5f5f5;cursor:pointer;-webkit-tap-highlight-color:transparent}
.d-sub-row:last-child{border-bottom:none}
.d-sub-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d-sub-name{font-size:14px;color:#333;flex:1}
.d-sub-amt{font-size:14px;font-weight:700;color:#1a1a1a;background:#f5f5f7;border-radius:6px;padding:2px 10px}
.d-sub-meta{font-size:11px;color:#bbb;min-width:96px;text-align:right}
/* 报销详情 */
.reimb-alert{background:#FFF3E0;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:11px;color:#E65100;display:flex;align-items:center;gap:6px}
.reimb-list{display:flex;flex-direction:column;gap:6px}
.reimb-item{background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent}
.reimb-item:active{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ri-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ri-name{font-size:13px;font-weight:600;color:#1a1a1a}
.ri-name.done{text-decoration:line-through;color:#aaa}
.ri-amt{font-size:14px;font-weight:700;color:#185FA5}
.ri-bot{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.rbadge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:500}
.rbadge.inv{background:#e8f5e9;color:#2e7d32}
.rbadge.noinv{background:#f5f5f5;color:#888}
.rbadge.done{background:#ffebee;color:#c62828}
.ri-dl{font-size:10px;color:#aaa}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;margin-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}

function fmtN(n){const d=ST?.decimals==='2'?2:0;return'¥'+Number(Math.abs(n)).toFixed(d)}

function budgetRingData(){
  const recs=Array.isArray(RC)?RC:[];
  const asOf=todayStr();
  const period=periodBounds(asOf);
  const mk=period.start.slice(0,7);
  const dim=daysBetween(period.start,period.end);
  const today=daysBetween(period.start,asOf);
  const settings=getSettingsForPeriod(period.start);
  const dailyBudget=settings.daily;
  const pocket=settings.extra;
  const inPeriod=r=>r.date>=period.start&&r.date<=asOf;
  const earned=recs.filter(r=>r.type==='income'&&inPeriod(r)).reduce((a,r)=>a+(r.amount||0),0);
  const income=ST.income_merge==='yes'?earned:0;
  const spent=recs.filter(r=>r.type==='expense'&&inPeriod(r)).reduce((a,r)=>a+(r.amount||0),0);
  const prevCarry=autoCarryOver(period.start);
  const totalBudget=dailyBudget*dim+pocket+income+prevCarry;
  const remain=totalBudget-spent;
  const daysPassed=Math.max(1,today);
  const daysLeft=Math.max(0,dim-today);
  const avgSpent=spent/daysPassed;
  const avgRemain=daysLeft>0?remain/daysLeft:0;
  const pct=totalBudget>0?Math.round(spent/totalBudget*100):0;
  return{mk,dim,today,income,spent,dailyBudget,pocket,prevCarry,totalBudget,remain,daysPassed,daysLeft,avgSpent,avgRemain,pct,periodStart:period.start,periodEnd:period.end,settleDay:period.settleDay};
}
function fmtSigned(n){return(n<0?'-':'')+fmtN(n)}

function autoType(t){if(t.includes('小金库')&&/(支出|花了|花费|交水电|交电费|交水费|缴费)/.test(t))return 'expense';return INCOME_KW.some(k=>t.includes(k))?'income':'expense'}
function autoCat(t,type){if(type==='expense'&&CKWS.水电.some(k=>t.includes(k)))return '水电';if(type==='income'&&t.includes('小金库'))return '小金库';const cats=type==='income'?ICATS:type==='reimbursement'?RCATS:ECATS;for(const c of cats){const kws=CKWS[c.k]||[];if(kws.some(k=>t.includes(k)))return c.k;}return cats[0].k}
function getCatMeta(k,type){const cats=type==='income'?ICATS:type==='reimbursement'?RCATS:ECATS;return cats.find(c=>c.k===k)||cats[0]}
function daysLeft(dl){if(!dl)return null;return Math.ceil((new Date(dl)-new Date())/(86400000))}
function uniqueTs(base){let ts=base;while(RC.some(r=>r.ts===ts)||RM.some(r=>r.ts===ts))ts++;return ts}
function makeTs(date,time,offset=0){const clean=/^\d{1,2}:\d{1,2}$/.test(time||'')?time:nowStr();const n=new Date(date+'T'+clean+':00').getTime();return uniqueTs((Number.isFinite(n)?n:Date.now())+offset)}

function dateHint(t){
  if(/大前天/.test(t))return addDaysStr(-3);
  if(/前天/.test(t))return addDaysStr(-2);
  if(/昨天|昨日/.test(t))return addDaysStr(-1);
  if(/今天|今日/.test(t))return todayStr();
  const full=t.match(/(20\d{2})[年\-\/.](\\d{1,2})[月\-\/.](\\d{1,2})/);
  if(full)return`${full[1]}-${pad2(full[2])}-${pad2(full[3])}`;
  const md=t.match(/(\d{1,2})月(\d{1,2})[日号]?/)||t.match(/(?:^|\s)(\d{1,2})[\/.](\\d{1,2})(?=\s|$)/);
  if(md){const d=new Date();return`${d.getFullYear()}-${pad2(md[1])}-${pad2(md[2])}`;}
  return null;
}
function leadingDateHint(t){
  const s=t.trim();
  if(/^(大前天|前天|昨天|昨日|今天|今日)/.test(s))return dateHint(s);
  if(/^(20\d{2})[年\-\/.]/.test(s))return dateHint(s);
  if(/^\d{1,2}[月\/.]/.test(s))return dateHint(s);
  return null;
}
function timeHint(t){const m=t.match(/([01]?\d|2[0-3])[:：点](\d{1,2})?/);if(!m)return null;return pad2(m[1])+':'+pad2(m[2]||0)}
function splitQuickEntries(raw){
  const normalized=raw.replace(/[，,；;、|\/·\n]+/g,';').replace(/\s+/g,' ').trim();
  const parts=normalized.split(';').map(s=>s.trim()).filter(Boolean);
  const out=[];
  const re=/(.+?)([+\-＋－]?\d+(?:\.\d+)?)(?:\s*(?:元|块|rmb|RMB|cny|CNY|¥|￥))?(?=\s+[^0-9+\-＋－¥￥]*[+\-＋－]?\d|$)/g;
  parts.forEach(part=>{let m;re.lastIndex=0;while((m=re.exec(part))){const sa=m[2].replace('＋','+').replace('－','-');if(m[1].trim()&&parseFloat(sa)!==0)out.push({text:(m[1]+m[2]).trim(),amountText:sa});}});
  return out;
}
function splitReimbEntries(raw){
  const normalized=raw.replace(/[，,；;、|\/·\n]+/g,';').replace(/\s+/g,' ').trim();
  const parts=normalized.split(';').map(s=>s.trim()).filter(Boolean);
  const out=[];
  const re=/(.+?)([+\-＋－]?\d+(?:\.\d+)?)([^0-9+\-＋－]*?)(?=\s+[^0-9+\-＋－]*[+\-＋－]?\d|$)/g;
  parts.forEach(part=>{let m;re.lastIndex=0;while((m=re.exec(part))){const sa=m[2].replace('＋','+').replace('－','-');if(m[1].trim()&&parseFloat(sa)!==0)out.push({text:(m[1]+m[2]+(m[3]||'')).trim(),amountText:sa});}});
  return out;
}
function cleanQuickLabel(text,amountText){
  return text.replace(amountText,'').replace(/(20\d{2})[年\-\/.]\d{1,2}[月\-\/.]\d{1,2}[日号]?/g,'').replace(/\d{1,2}[月\/.]\d{1,2}[日号]?/g,'').replace(/大前天|前天|昨天|昨日|今天|今日/g,'').replace(/([01]?\d|2[0-3])[:：点]\d{0,2}/g,'').replace(/报销|支出|花了|收入|收到|收款|入账|到账|赚了/g,'').replace(/[元块￥¥+＋\-－]/g,'').replace(/\s+/g,' ').trim();
}
function quickKind(text,amountText){
  if(amountText.startsWith('+'))return 'income';
  if(amountText.startsWith('-'))return 'expense';
  if(/报销/.test(text)&&!/(报销收|报销到账|报销款|收到报销|报销已到|已报销)/.test(text))return 'reimbursement';
  return autoType(text);
}
function cellColor(net,budget){
  if(!net||Math.abs(net)<0.5)return{bg:'#f0f0f0',txt:'#1a1a1a'}
  if(net>0){const g=Math.min(1,net/(budget||50)/2);return{bg:`rgb(${Math.round(76+g*20)},${Math.round(175-g*50)},${Math.round(80+g*10)})`,txt:'#fff'}}
  const ratio=Math.abs(net)/(budget||50);
  if(ratio<0.3)return{bg:'#FFCDD2',txt:'#b71c1c'}
  if(ratio<0.7)return{bg:'#EF9A9A',txt:'#fff'}
  if(ratio<1.2)return{bg:'#e53935',txt:'#fff'}
  return{bg:'#B71C1C',txt:'#fff'}
}

// Backups contain complete module state; missing modules remain untouched.
const APP_STORAGE_KEYS=['bav7','monthly_v1','finance_v1'];
const RECOVERY_STORAGE_KEY='finance_recovery_v1';
function backupOwn(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function backupError(path){throw new Error('备份字段无效：'+path)}
function backupObject(v,path){if(!v||typeof v!=='object'||Array.isArray(v))backupError(path);return v}
function backupArray(v,path){if(!Array.isArray(v))backupError(path);return v}
function backupNumber(v,path,min=-Number.MAX_VALUE,max=Number.MAX_VALUE,integer=false){
  if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max||(integer&&!Number.isSafeInteger(v)))backupError(path);
  return v;
}
function backupString(v,path){if(typeof v!=='string')backupError(path);return v}
function backupBool(v,path){if(typeof v!=='boolean')backupError(path)}
function backupEnum(v,values,path){if(!values.includes(v))backupError(path)}
function backupId(v,path){if(typeof v!=='string'||!/^[A-Za-z0-9_-]+$/.test(v)||['__proto__','prototype','constructor'].includes(v))backupError(path)}
function backupDate(v,path,allowEmpty=false){
  if(allowEmpty&&v==='')return;
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))backupError(path);
  const d=new Date(v+'T00:00:00Z');
  if(!Number.isFinite(d.getTime())||d.toISOString().slice(0,10)!==v)backupError(path);
}
function backupFields(o,path,numbers=[],strings=[],booleans=[]){
  numbers.forEach(k=>{if(backupOwn(o,k))backupNumber(o[k],path+'.'+k)});
  strings.forEach(k=>{if(backupOwn(o,k))backupString(o[k],path+'.'+k)});
  booleans.forEach(k=>{if(backupOwn(o,k))backupBool(o[k],path+'.'+k)});
}
function backupUnique(rows,key,path){
  const seen=new Set();rows.forEach(r=>{if(backupOwn(r,key)){if(seen.has(r[key]))backupError(path+'.'+key+'重复');seen.add(r[key]);}});
}
function backupSafeTree(value,path='备份',depth=0){
  if(depth>40)backupError(path+'层级过深');
  if(typeof value==='number'&&!Number.isFinite(value))backupError(path);
  if(value&&typeof value==='object')Object.keys(value).forEach(k=>{
    if(['__proto__','prototype','constructor'].includes(k))backupError(path+'.'+k);
    backupSafeTree(value[k],path+'.'+k,depth+1);
  });
}
function validateDiaryBackup(raw,legacy=false){
  backupObject(raw,'diary');
  const existing=legacy?ld():{};
  const d={...raw};
  const defaults={purpose:'budget',budget:50,settleDay:1,carryover:'yes',hasPrevBalance:false,prevBalance:0,income_merge:'yes',hasExtra:false,extraAmount:0,show_reimb:'no',decimals:'2'};
  if(backupOwn(d,'settings'))backupObject(d.settings,'diary.settings');
  d.settings={...defaults,...(backupOwn(d,'settings')?d.settings:(legacy?existing.settings:{}))};
  const settings=d.settings;
  backupFields(settings,'diary.settings',['budget','prevBalance','extraAmount'],['purpose'],['hasPrevBalance','hasExtra']);
  backupNumber(settings.budget,'diary.settings.budget',0);
  backupNumber(settings.extraAmount,'diary.settings.extraAmount',0);
  backupNumber(settings.settleDay,'diary.settings.settleDay',1,31,true);
  ['carryover','income_merge','show_reimb'].forEach(k=>backupEnum(settings[k],['yes','no'],'diary.settings.'+k));
  backupEnum(settings.decimals,['0','2'],'diary.settings.decimals');
  for(const kind of ['records','reimbs']){
    d[kind]=backupOwn(d,kind)?d[kind]:(legacy&&Array.isArray(existing[kind])?existing[kind]:[]);
    backupArray(d[kind],'diary.'+kind).forEach((r,i)=>{
      const p='diary.'+kind+'['+i+']';backupObject(r,p);
      backupNumber(r.amount,p+'.amount',0);backupDate(r.date,p+'.date');
      backupNumber(r.ts,p+'.ts',0,Number.MAX_SAFE_INTEGER,true);
      backupFields(r,p,[],['label','name','cat','time','invoiceStatus'],['hasInvoice','reimbursed']);
      if(backupOwn(r,'time')&&r.time!==''&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(r.time))backupError(p+'.time');
      if(backupOwn(r,'deadline'))backupDate(r.deadline,p+'.deadline',true);

function prepareImportedState(raw,scope='all'){

  const updates={};

    // Validate the entire file before selecting the requested modules.
    const checked={};
    if(backupOwn(data,'diary'))checked.diary=validateDiaryBackup(data.diary);
    if(backupOwn(data,'monthly'))checked.monthly=validateMonthlyBackup(data.monthly);
    if(backupOwn(data,'finance'))checked.finance=validateFinanceBackup(data.finance);
    if(scope==='finance'){
      if(!backupOwn(checked,'finance'))backupError('finance 缺失');updates.finance_v1=checked.finance;
    }else{

      if(backupOwn(checked,'finance'))updates.finance_v1=checked.finance;

    updates.bav7=validateDiaryBackup(data,true);
  }else{backupError('文件格式');}
  if(!Object.keys(updates).length)backupError('没有可恢复的数据');

function writeAppStorageTransaction(serialized,saveRecovery=true){
  const keys=Object.keys(serialized);
  if(!keys.length||keys.some(k=>!APP_STORAGE_KEYS.includes(k)))throw new Error('恢复范围无效');
  const before={};keys.forEach(k=>{before[k]=localStorage.getItem(k)});
  if(saveRecovery){
    // If the recovery copy cannot fit, abort before replacing any app data.
    try{localStorage.setItem(RECOVERY_STORAGE_KEY,JSON.stringify({savedAt:new Date().toISOString(),values:before}));}
    catch(e){throw new Error('无法保存导入前备份，原数据未改动；请先导出备份并检查浏览器存储空间');}
  }
  try{keys.forEach(k=>{if(serialized[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,serialized[k]);});}
  catch(e){
    let restored=true;
    keys.forEach(k=>{try{if(before[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,before[k]);}catch(err){restored=false;}});
    throw new Error(restored?'写入失败，已保留原数据；请检查浏览器存储空间':'写入失败；导入前备份仍保留，请使用“撤销上次导入”恢复');
  }
}

function settleDay(){const v=parseInt(ST?.settleDay||1,10);return Math.min(31,Math.max(1,v||1))}
function settleDate(y,m,d){const dim=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,dim))}
function daysBetween(a,b){return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1}
function periodBounds(asOf=todayStr()){
  const d=new Date(asOf+'T00:00:00');const sd=settleDay();
  let start=settleDate(d.getFullYear(),d.getMonth(),sd);
  if(d<start)start=settleDate(d.getFullYear(),d.getMonth()-1,sd);
  const next=settleDate(start.getFullYear(),start.getMonth()+1,sd);
  const end=new Date(next);end.setDate(end.getDate()-1);
  return{start:dateStr(start),end:dateStr(end),settleDay:sd};
}
// 计算指定周期的结余（用于跨周期继承）
// ─── 预算历史（按周期隔离）───
// 格式：[{from:'2026-01-01', daily:50, extra:170}]
// from 是该设置生效的第一天（即某个周期的开始日）
function getBudgetHistory(){
  const s=ld();return s.budgetHistory||[];
}
function saveBudgetHistory(hist){
  const s=ld();s.budgetHistory=hist;sv(s);
}
// 获取某个周期开始日期对应的日预算和零花钱
function getSettingsForPeriod(periodStart){
  const hist=getBudgetHistory();
  // 找最近的一条 from <= periodStart
  const match=hist.filter(h=>h.from<=periodStart).sort((a,b)=>b.from.localeCompare(a.from))[0];
  if(match)return{daily:match.daily,extra:match.extra};
  // 没有历史记录，用当前设置
  return{daily:parseFloat(ST.budget)||50,extra:ST.hasExtra?(parseFloat(ST.extraAmount)||0):0};
}
// 修改预算时记录历史
function applyBudgetChange(daily,extra,fromDate){
  const hist=getBudgetHistory();
  // 如果同一天已有记录就覆盖
  const idx=hist.findIndex(h=>h.from===fromDate);
  if(idx>=0)hist[idx]={from:fromDate,daily,extra};
  else hist.push({from:fromDate,daily,extra});
  hist.sort((a,b)=>a.from.localeCompare(b.from));
  saveBudgetHistory(hist);
  // 同步更新当前ST
  ST.budget=daily;ST.hasExtra=extra>0;ST.extraAmount=extra;
  const s=ld();s.settings=ST;sv(s);
}
// 初始化预算历史（首次运行时把当前设置写入）
function initBudgetHistory(){
  const hist=getBudgetHistory();
  if(!hist.length){
    const daily=parseFloat(ST.budget)||50;
    const extra=ST.hasExtra?(parseFloat(ST.extraAmount)||0):0;
    saveBudgetHistory([{from:'2026-01-01',daily,extra}]);
  }
}

// 自动计算跨周期继承的结余（递归追溯）
function autoCarryOver(currentPeriodStart){
  if(ST.carryover!=='yes')return ST.hasPrevBalance?(parseFloat(ST.prevBalance)||0):0;
  // 找上一个周期
  const d=new Date(currentPeriodStart+'T00:00:00');
  d.setDate(d.getDate()-1);// 上个周期的最后一天
  const prevPeriod=periodBounds(dateStr(d));
  // 上个周期有没有任何记录
  const prevRecs=RC.filter(r=>r.date>=prevPeriod.start&&r.date<=prevPeriod.end);
  if(!prevRecs.length){
    // 上个周期没有记录，用设置里的初始结余
    return ST.hasPrevBalance?(parseFloat(ST.prevBalance)||0):0;
  }
  // 上个周期的可用 = 上上期结余 + 累积预算 + 零花 + 收入 - 支出
  const prevCarry=autoCarryOver(prevPeriod.start);
  const prevBalance=calcPeriodBalanceWithCarry(prevPeriod.start,prevPeriod.end,prevCarry);
  return Math.max(0,prevBalance);// 超支不继承（负数按0处理）
}
function calcPeriodBalanceWithCarry(periodStart,periodEnd,carry){
  const{daily,extra}=getSettingsForPeriod(periodStart);
  const days=Math.max(1,daysBetween(periodStart,periodEnd));
  const recs=RC.filter(r=>r.date>=periodStart&&r.date<=periodEnd);
  const spent=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const earned=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const accrued=daily*days;
  const income_add=ST.income_merge==='yes'?earned:0;
  return accrued+extra+income_add+carry-spent;
}
function budgetState(asOf=todayStr()){
  if(ST.purpose==='record')return null;
  const p=periodBounds(asOf);
  const{daily,extra}=getSettingsForPeriod(p.start);
  // 自动计算上期继承结余
  const previous=autoCarryOver(p.start);
  const start=p.start;
  const recs=RC.filter(r=>r.date>=start&&r.date<=asOf);
  const todayRecs=RC.filter(r=>r.date===asOf);
  const spent=recs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const earned=recs.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0);
  const todaySpent=todayRecs.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0);
  const days=Math.max(1,daysBetween(start,asOf));
  const accrued=daily*days;const added=previous+extra+(ST.income_merge==='yes'?earned:0);
  const balance=accrued+added-spent;const dailyRemaining=daily-todaySpent;
  const periodDays=Math.max(1,daysBetween(p.start,p.end));
  const daysRemain=Math.max(0,daysBetween(asOf,p.end)-1);
  return{periodStart:p.start,periodEnd:p.end,settleDay:p.settleDay,calcStart:start,daily,extra,previous,spent,earned,todaySpent,dailyRemaining,days,accrued,added,balance,periodDays,daysRemain,periodTotal:daily*periodDays};
}

// ─── 月统计辅助 ───
function getMonthStats(mk,asOf='9999-12-31'){
  // 支持传入指定月份，默认当月
  if(!mk){const now=new Date();mk=now.getFullYear()+'-'+pad2(now.getMonth()+1);}
  const[yr,mo]=mk.split('-').map(Number);
  const daysInM=new Date(yr,mo,0).getDate();
  const monthRecs=RC.filter(r=>r.date&&r.date.startsWith(mk)&&r.date<=asOf&&r.type==='expense');
  const isThisMonth=isCurrentMonth(mk);
  const todayDay=isThisMonth?new Date().getDate():daysInM;
  const totalSpent=monthRecs.reduce((a,r)=>a+r.amount,0);
  const totalIncome=RC.filter(r=>r.date&&r.date.startsWith(mk)&&r.date<=asOf&&r.type==='income').reduce((a,r)=>a+r.amount,0);
  const dayAvg=todayDay>0?(totalSpent/todayDay):0;
  const dayMap={};monthRecs.forEach(r=>{dayMap[r.date]=(dayMap[r.date]||0)+r.amount});
  const maxDay=Object.entries(dayMap).sort((a,b)=>b[1]-a[1])[0];
  return{totalSpent,totalIncome,dayAvg,maxDay,todayDay,daysInMonth:daysInM,mk};
}

function get7DayTrend(){

// 上周同期对比
function getWeekCompare(){
  const now=new Date();
  let thisStart=new Date(now);thisStart.setDate(now.getDate()-now.getDay());
  let lastStart=new Date(thisStart);lastStart.setDate(thisStart.getDate()-7);
  let lastEnd=new Date(thisStart);lastEnd.setDate(thisStart.getDate()-1);
  const thisWk=RC.filter(r=>r.type==='expense'&&r.date>=dateStr(thisStart)&&r.date<=dateStr(now)).reduce((a,r)=>a+r.amount,0);
  const lastWk=RC.filter(r=>r.type==='expense'&&r.date>=dateStr(lastStart)&&r.date<=dateStr(lastEnd)).reduce((a,r)=>a+r.amount,0);
  return{thisWk,lastWk,diff:thisWk-lastWk,pct:lastWk>0?((thisWk-lastWk)/lastWk*100):0};
}

function getCatStats(mk,asOf='9999-12-31'){
  if(!mk){const now=new Date();mk=now.getFullYear()+'-'+pad2(now.getMonth()+1);}
  const[yr,mo]=mk.split('-').map(Number);
  const daysInM=new Date(yr,mo,0).getDate();
  const isThisMonth=isCurrentMonth(mk);
  const todayDay=isThisMonth?new Date().getDate():daysInM;
  const catMap={};
  RC.filter(r=>r.date&&r.date.startsWith(mk)&&r.date<=asOf&&r.type==='expense').forEach(r=>{
    if(!catMap[r.cat])catMap[r.cat]={total:0,count:0,max:0};
    catMap[r.cat].total+=r.amount;catMap[r.cat].count++;
    if(r.amount>catMap[r.cat].max)catMap[r.cat].max=r.amount;
  });
  return Object.entries(catMap).map(([cat,v])=>({
    cat,total:v.total,count:v.count,max:v.max,
    dayAvg:todayDay>0?(v.total/todayDay):0
  })).sort((a,b)=>b.total-a.total);
}

  '交通':{kw:[['地铁','地铁'],['公交','公交','巴士'],['打车','打车','滴滴','出租','网约','taxi'],['共享单车','单车','哈啰','青桔','美团单车'],['停车','停车'],['加油','加油','油费']]},

function timeMeal(time){
  const h=parseInt((time||'').split(':')[0],10);
  if(isNaN(h))return '其他';
  if(h>=5&&h<10)return '早餐';
  if(h>=10&&h<14)return '午餐';
  if(h>=14&&h<17)return '下午茶';
  if(h>=17&&h<21)return '晚餐';
  return '宵夜';
}
function getSubCat(rec){
  const rule=SUBCAT_RULES[rec.cat];

  const lbl=(rec.label||'').toLowerCase();
  for(const grp of rule.kw){for(let i=1;i<grp.length;i++){if(lbl.includes(grp[i].toLowerCase()))return grp[0];}}
  if(rule.meal)return timeMeal(rec.time);

// Calendar-month overview reads diary entries only; budgets and other ledgers are not expenses.
function reportValidDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const date=new Date(value+'T00:00:00Z');
  return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value;
}
function getReportYears(){
  const nowYear=new Date().getFullYear(),years=new Set([nowYear]);
  [...RC,...RM].forEach(r=>{if(reportValidDate(r.date)){const year=Number(r.date.slice(0,4));if(year<=nowYear)years.add(year);}});
  return [...years].sort((a,b)=>b-a);
}
function getYearOverview(year){
  const asOf=todayStr(),nowYear=Number(asOf.slice(0,4));
  year=Number(year);if(!Number.isInteger(year)||year<1||year>9999)year=nowYear;
  const currentMonth=asOf.slice(0,7),yearText=String(year).padStart(4,'0');
  const months=Array.from({length:12},(_,i)=>{
    const mk=yearText+'-'+pad2(i+1);
    return{mk,month:i+1,spent:0,income:0,count:0,isCurrent:mk===currentMonth,isFuture:mk>currentMonth};
  });
  RC.forEach(r=>{
    if(!reportValidDate(r.date)||r.date>asOf||r.date.slice(0,4)!==yearText||!['expense','income'].includes(r.type)||!Number.isFinite(r.amount)||r.amount<0)return;
    const row=months[Number(r.date.slice(5,7))-1];
    row[r.type==='expense'?'spent':'income']+=r.amount;row.count++;
  });
  const totalSpent=months.reduce((sum,m)=>sum+m.spent,0),totalIncome=months.reduce((sum,m)=>sum+m.income,0);
  const highestMonth=months.reduce((best,m)=>m.spent>0&&(!best||m.spent>best.spent)?m:best,null);
  return{year,months,totalSpent,totalIncome,highestMonth,asOf};
}

          const GAP=20;
          for(let it=0;it<10;it++){
            lbls.sort((a,b)=>a.y-b.y);
            for(let i=1;i<lbls.length;i++){

          }

          lbls.forEach(l=>{l.y=Math.max(pad,Math.min(chart.height-pad,l.y));});
          ctx.save();
          lbls.forEach(({x,y,name,pct})=>{
            ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillStyle='#666';ctx.font='500 9px -apple-system,sans-serif';

          });
          ctx.restore();

      }
    }
    checkModal();
  },30);
}

function switchMonth(dir){
  const cur=getViewMonth();
  if(dir==='prev'){
    const hasAnyPrev=RC.some(r=>r.date&&r.date<cur)||RM.some(r=>r.date&&r.date<cur);
    if(!hasAnyPrev)return;
    viewMonth=prevMonth(cur);
  }else{
    if(isCurrentMonth(cur))return;
    const nm=nextMonth(cur);
    viewMonth=isCurrentMonth(nm)?null:nm;
  }
  // 切换月份时重置选中日期
  const vm=getViewMonth();
  const[y,m]=vm.split('-').map(Number);
  if(isCurrentMonth(vm)){selDate=todayStr();detailSel=todayStr();}
  else{const d=`${escHtml(y)}-${String(m).padStart(2,'0')}-01`;selDate=d;detailSel=d;}
  // 关键修复：在详情页时停留在详情页，不跳回主页
  if(detailView)renderDetail();
  else showApp();
}
function selDay(ds){selDate=ds;showApp()}
function openDetail(view){
  if(view==='report'){window._reportMode='overview';window._reportYear=new Date().getFullYear();}
  destroyCharts();detailView=view;
  // 进入日历详情，保持当前选中日期；如果选中日期不在 viewMonth，重置为 viewMonth 第一天
  const vm=getViewMonth();
  if(view==='cal'&&(!detailSel||!detailSel.startsWith(vm))){
    if(isCurrentMonth(vm))detailSel=todayStr();
    else{const[y,m]=vm.split('-').map(Number);detailSel=`${escHtml(y)}-${String(m).padStart(2,'0')}-01`;}
  }
  // 进入报销时自动选最有意义的tab
  if(view==='reimb')openReimbDetail();
  document.getElementById('app-screen').style.display='none';
  const ds=document.getElementById('detail-screen');ds.style.display='flex';ds.style.flexDirection='column';
  renderDetail();
}

function M_migrateUtilityToDiary(s){
  if(s.utilityInDiary===true)return s;
  const next={...s,utilityInDiary:true};
  if(Array.isArray(s.bills)){
    const isUtility=b=>/^(水电|水电费|水费|电费|水电燃气费)$/.test(String(b.name||'').trim())||b.id==='utility';
    const removed=s.bills.filter(isUtility);
    next.bills=s.bills.filter(b=>!isUtility(b));
    if(removed.length)next.archivedUtilityBills=[...(Array.isArray(s.archivedUtilityBills)?s.archivedUtilityBills:[]),...removed];
  }

}

function M_getAlerts(){
  const alerts=[];const today=M_todayDay();const alertDays=M_CFG.alertDays||3;
  M_CFG.bills.forEach(bill=>{
    const status=M_getBillStatus(bill.id);
    if(!status.paid){
      const daysUntil=bill.dueDay-today;
      if(daysUntil>=0&&daysUntil<=alertDays)alerts.push(`${bill.name} ¥${escHtml(bill.amount)} 还有 ${daysUntil===0?'今天':daysUntil+'天'} 到期`);
      else if(daysUntil<0)alerts.push(`${bill.name} ¥${escHtml(bill.amount)} 已逾期 ${Math.abs(daysUntil)} 天`);
    }
  });
  return alerts;
}

function M_getSummary(){
  const totalFixed=M_CFG.bills.reduce((s,b)=>{const st=M_getBillStatus(b.id);return s+(st.actualAmount!=null?st.actualAmount:b.amount)},0);
  const paidFixed=M_CFG.bills.reduce((s,b)=>{const st=M_getBillStatus(b.id);if(!st.paid)return s;return s+(st.actualAmount!=null?st.actualAmount:b.amount)},0);
  const unpaidFixed=totalFixed-paidFixed;
  return{totalFixed,paidFixed,unpaidFixed};
}

// ─── 财务总览 JS ───

const F_SK='finance_v1';
const COLORS=['#378ADD','#4caf50','#FFD700','#ef5350','#9c27b0','#ff9800','#00bcd4'];
const GROUP_INFO={

};

// ── 默认数据 ──
const F_DEFAULT_ITEMS=[];// 无默认数据，用户自行添加

// 股票账户默认数据（空）

  initialCapital:10000,
  deposits:[],
  stocks:[],
};

function F_ld(){try{return JSON.parse(localStorage.getItem(F_SK)||'{}')}catch(e){return{}}}
function F_sv(d){localStorage.setItem(F_SK,JSON.stringify(d))}
function F_fmt2(n){const value=Number(n).toFixed(2);return Number(value)===0?'0.00':value}
function F_fmtY(n,dec=2){const value=F_fmt2(n);return value.startsWith('-')?'-¥'+value.slice(1):'¥'+value}
function F_fmtPnl(n){return(Number(F_fmt2(n))>0?'+':'')+F_fmtY(n)}
function F_pnlClass(n){const value=Number(F_fmt2(n));return value>0?'pos':value<0?'neg':'zero'}
function F_genId(){return'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
let F_ITEMS=[],F_STOCK_ACCOUNT={},F_modal=null,F_editId=null,F_editSub=null;

function F_loadData(){
  const s=F_ld();
  F_ITEMS=s.items||JSON.parse(JSON.stringify(F_DEFAULT_ITEMS));
  F_STOCK_ACCOUNT=s.stockAccount||JSON.parse(JSON.stringify(F_DEFAULT_STOCK_ACCOUNT));
}
function F_saveData(){
  const s=F_ld();s.items=F_ITEMS;s.stockAccount=F_STOCK_ACCOUNT;F_sv(s);
}

// ── 股票计算 ──
function F_stockRecords(st,key){return Array.isArray(st[key])?st[key]:[]}
function F_validTradeDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const time=Date.parse(value+'T00:00:00Z');
  return Number.isFinite(time)&&new Date(time).toISOString().slice(0,10)===value;
}
function F_tradeTime(r){
  // New trades store an explicit order; older generated IDs embed their creation time.
  if(Number.isSafeInteger(r.order)&&r.order>=0)return r.order;
  const id=typeof r.id==='string'?r.id:'';
  if(/^i[a-z0-9]{10,15}$/.test(id)){
    const time=parseInt(id.slice(1,-3),36);
    if(time>=946684800000&&time<=4102444800000)return time;
  }
  return 0;
}
function F_nextTradeOrder(st){let order=Date.now();for(const key of ['buyRecords','sellRecords'])for(const r of F_stockRecords(st,key))order=Math.max(order,F_tradeTime(r||{})+1);return order}
function F_calcStock(st){
  const errors=[],issues=[],events=[],sellProfits=[];
  let totalBought=0,totalSold=0,totalCost=0,totalSoldAmt=0;
  for(const [key,type,label] of [['buyRecords','buy','买入'],['sellRecords','sell','卖出']]){
    if(!Array.isArray(st[key])){errors.push(label+'记录格式异常，请从备份修正后导入');issues.push(key+':shape');}
    F_stockRecords(st,key).forEach((raw,index)=>{
      const r=raw&&typeof raw==='object'?raw:{};
      const qty=Number(r.qty),price=Number(r.price),amount=Number(r.amount);
      const prefix='第'+(index+1)+'笔'+label;
      const issue=(code,message)=>{issues.push(type+':'+(r.id||index)+':'+code);errors.push(prefix+message)};
      const before=errors.length;
      if(!F_validTradeDate(r.date))issue('date','日期无效，请编辑日期');
      if(!Number.isFinite(price)||price<=0)issue('price','价格必须大于 0');
      if(!Number.isSafeInteger(qty)||qty<=0)issue('qty','股数必须为正整数');
      if(!Number.isFinite(amount)||amount<=0||amount>Number.MAX_SAFE_INTEGER/100)issue('amount','金额必须为有效正数');
      // Keep finite recorded cash flows visible even if a legacy history needs repair.
      if(Number.isFinite(qty)){if(type==='buy')totalBought+=qty;else totalSold+=qty;}
      if(Number.isFinite(amount)){if(type==='buy')totalCost+=amount;else totalSoldAmt+=amount;}
      if(errors.length===before)events.push({r,index,type,qty,amount,time:F_tradeTime(r)});
    });
  }
  // Legacy records without a creation time use buys-first ordering within their date.
  events.sort((a,b)=>a.r.date.localeCompare(b.r.date)||
    (a.time||(a.type==='buy'?0:Number.MAX_SAFE_INTEGER))-(b.time||(b.type==='buy'?0:Number.MAX_SAFE_INTEGER))||
    (a.type===b.type?a.index-b.index:a.type==='buy'?-1:1));
  let remainingQty=0,remainingCost=0,totalProfit=0;
  for(const e of events){
    if(e.type==='buy'){remainingQty+=e.qty;remainingCost+=e.amount;continue;}
    if(e.qty>remainingQty){
      issues.push('sell:'+(e.r.id||e.index)+':oversold');
      errors.push('第'+(e.index+1)+'笔卖出超过当时持仓（可卖 '+remainingQty+' 股），请修正日期、股数或补齐买入记录');
      continue;
    }
    const cost=remainingCost/remainingQty*e.qty;
    const profit=e.amount-cost;
    sellProfits[e.index]=Math.abs(profit)<1e-8?0:profit;
    totalProfit+=sellProfits[e.index];
    remainingQty-=e.qty;remainingCost-=cost;
    if(remainingQty===0)remainingCost=0;
  }
  const valid=errors.length===0;
  const holdQty=totalBought-totalSold;
  const holdCost=remainingCost;
  const avgCost=remainingQty>0?remainingCost/remainingQty:0;
  const tpPct=Number.isFinite(Number(st.tpPct))?Number(st.tpPct):20;
  const slPct=Number.isFinite(Number(st.slPct))?Number(st.slPct):-15;
  const tpPrice=avgCost>0?avgCost*(1+tpPct/100):0;
  const slPrice=avgCost>0?avgCost*(1+slPct/100):0;
  return{holdQty,totalBought,totalSold,totalCost,totalSoldAmt,totalProfit,avgCost,holdCost,tpPrice,slPrice,sellProfits,valid,errors,issues};
}
function F_stockIssueHtml(cal){return cal.valid?'':`<div class="f-info-box" role="alert" style="background:#fff3e0;color:#a44700">记录待核对：${escHtml(cal.errors.join('；'))}。相关盈亏暂不显示，原记录已保留。</div>`}
function F_planPnl(cal,price,qty){return!cal.valid?'待核对':cal.holdQty<=0?'无持仓':F_fmtPnl((price-cal.avgCost)*qty)}
function F_planPnlClass(cal,price,qty){return cal.valid&&cal.holdQty>0?F_pnlClass((price-cal.avgCost)*qty):'zero'}
function F_applyStockTrades(st,candidate,allowRepair=false){
  const next=F_calcStock(candidate),before=F_calcStock(st);
  // A damaged legacy history can be repaired one record at a time, without adding new issues.
  const improves=allowRepair&&!before.valid&&next.issues.length<before.issues.length&&next.issues.every(issue=>before.issues.includes(issue));
  if(!next.valid&&!improves){alert('无法保存：'+next.errors.join('；'));return false;}
  st.buyRecords=candidate.buyRecords;
  st.sellRecords=candidate.sellRecords.map((r,i)=>next.valid?{...r,profit:next.sellProfits[i]}:r);
  return true;
}
function F_readTrade(prefix,withAmount=false){
  const price=Number(document.getElementById(prefix+'price')?.value);
  const qty=Number(document.getElementById(prefix+'qty')?.value);
  const rawAmount=withAmount?document.getElementById(prefix+'amt')?.value:'';
  return{date:document.getElementById(prefix+'date')?.value||todayStr(),price,qty,
    amount:rawAmount!=null&&String(rawAmount).trim()!==''?Number(rawAmount):price*qty,
    note:document.getElementById(prefix+'note')?.value.trim()||''};
}

// ── 账户资金 ──
function F_calcAccount(){
  const initial=Number.isFinite(Number(F_STOCK_ACCOUNT.initialCapital))?Number(F_STOCK_ACCOUNT.initialCapital):0;
  const deposited=(F_STOCK_ACCOUNT.deposits||[]).reduce((s,d)=>s+(Number.isFinite(Number(d?.amount))?Number(d.amount):0),0);
  const totalIn=initial+deposited;
  // Hidden stocks remain in every account total.
  const stocks=F_STOCK_ACCOUNT.stocks.map(F_calcStock);
  const totalBought=stocks.reduce((s,c)=>s+c.totalCost,0);
  const totalSold=stocks.reduce((s,c)=>s+c.totalSoldAmt,0);
  const totalProfit=stocks.reduce((s,c)=>s+c.totalProfit,0);
  const holdCost=stocks.reduce((s,c)=>s+c.holdCost,0);
  // 可用资金 = 总投入 - 总买入 + 总卖出
  const available=totalIn-totalBought+totalSold;
  return{initial,deposited,totalIn,totalBought,totalSold,totalProfit,holdCost,available,valid:stocks.every(c=>c.valid)};
}

// ── 投资项计算 ──
function F_getTotalInvested(item){
  const base=item.invested||0;
  const recs=item.records||[];
  const net=recs.reduce((s,r)=>{
    if(r.type==='note'||r.amount===0)return s;
    return s+(r.type==='withdraw'?(r.returned?0:-r.amount):r.amount);
  },0);
  return base+net;
}
function F_getTotalWithdrawn(item){
  return (item.records||[]).filter(r=>r.type==='withdraw'&&!r.returned).reduce((s,r)=>s+r.amount,0);
}
function F_getRemain(item){return Math.max(0,item.target-F_getTotalInvested(item))}
function F_getPct(item){return Math.min(100,Math.round(F_getTotalInvested(item)/item.target*100))}
function F_isCompleted(item){return F_getTotalInvested(item)>=item.target}

function F_submitItemEdit(id){
  const idx=F_ITEMS.findIndex(i=>i.id===id);if(idx<0)return;
  const old=F_ITEMS[idx];
  const newName=document.getElementById('e-name')?.value.trim()||old.name;
  const newTarget=Number(document.getElementById('e-target')?.value);
  const newInvested=Number(document.getElementById('e-invested')?.value);
  const newMonthly=Number(document.getElementById('e-monthly')?.value);
  const newAutoInvest=document.getElementById('F_e_auto')?.value==='1';
  const newInvestDay=Number(document.getElementById('F_e_invest_day')?.value);
  if(!Number.isFinite(newTarget)||newTarget<=0||!Number.isFinite(newInvested)||newInvested<0||!Number.isFinite(newMonthly)||newMonthly<0||!Number.isInteger(newInvestDay)||newInvestDay<1||newInvestDay>31){alert('请输入正数目标金额、非负投入金额和1至31号定投日');return;}
  // 先按旧计划处理已到期月份，避免新金额改写过去的自动记录。
  F_autoInvest();
  const newPlatform=document.getElementById('e-platform')?.value.trim()||'';
  const newNote=document.getElementById('e-note')?.value.trim()||'';
  const newGroup=document.getElementById('e-group')?.value||old.group;
  // 记录变更
  if(!F_ITEMS[idx].records)F_ITEMS[idx].records=[];
  const changes=[];
  if(newTarget!==old.target)changes.push(`目标 ${F_fmtY(old.target)}→${F_fmtY(newTarget)}`);
  if(newMonthly!==old.monthly)changes.push(`月投 ${F_fmtY(old.monthly)}→${F_fmtY(newMonthly)}`);
  if(Math.abs(newInvested-old.invested)>0.01)changes.push(`初始投入 ${F_fmtY(old.invested)}→${F_fmtY(newInvested)}`);
  if(changes.length){
    F_ITEMS[idx].records.push({date:todayStr(),amount:0,note:'📝 '+changes.join('；'),type:'note',returned:false});
  }
  const scheduleChanged=newAutoInvest!==!!old.autoInvest||newMonthly!==old.monthly||newInvestDay!==(old.investDay||16);
  const schedule=scheduleChanged?{autoInvestSince:newAutoInvest?todayStr():null,autoInvestCheckedMonth:null}:{};
  F_ITEMS[idx]={...F_ITEMS[idx],...schedule,name:newName,group:newGroup,target:newTarget,invested:newInvested,monthly:newMonthly,platform:newPlatform,note:newNote,autoInvest:newAutoInvest,investDay:newInvestDay};
  F_autoInvest();
  F_saveData();showToast_f('✓ 已保存');F_modal=null;F_editId=null;F_renderMain();
}

function F_exportData(){
  try{
    const data={app:'财务管家',schema:4,exportedAt:new Date().toISOString(),finance:F_ld()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    const d=new Date();
    a.download=`财务管家_财务总览_${d.getMonth()+1}月${d.getDate()}日${d.getFullYear()}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){alert('导出失败，请检查本地数据和浏览器存储权限');}
}
function F_importData(e){
  const input=e.target;const file=input.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{applyImportedState(JSON.parse(ev.target.result),'finance');}
    catch(err){alert(err.message||'导入失败，原数据未改动');return;}
    try{F_loadData();F_modal=null;F_renderMain();alert('✓ 财务总览已恢复，记账和账单不变；可撤销本次导入');}
    catch(err){alert('财务数据已恢复，显示异常；可在数据页撤销本次导入');}
  };
  reader.onerror=()=>alert('读取文件失败，原数据未改动');
  reader.readAsText(file);input.value='';
}
function F_resetData(){
  if(!confirm('确认恢复默认数据？'))return;
  F_ITEMS=JSON.parse(JSON.stringify(F_DEFAULT_ITEMS));

function F_calcBuyTotal(){
  const price=Number(document.getElementById('F_b_price')?.value);
  const qty=Number(document.getElementById('F_b_qty')?.value);
  const amt=document.getElementById('F_b_amt');
  if(amt&&!amt.dataset.manual){
    amt.value=Number.isFinite(price)&&price>0&&Number.isFinite(qty)&&qty>0?(price*qty).toFixed(2):'';
  }
  F_calcBuyAvg();
}
function F_calcBuyAvg(){
  const st=F_STOCK_ACCOUNT.stocks.find(s=>s.id===F_editId);if(!st)return;
  const qty=Number(document.getElementById('F_b_qty')?.value);
  const rawAmount=document.getElementById('F_b_amt')?.value;
  const price=Number(document.getElementById('F_b_price')?.value);
  const actualAmt=rawAmount!=null&&rawAmount.trim()!==''?Number(rawAmount):price*qty;
  const box=document.getElementById('F_buy_calc');
  const qtyEl=document.getElementById('F_bc_qty');
  const avgEl=document.getElementById('F_bc_avg');
  if(!box||!qtyEl||!avgEl)return;
  if(Number.isFinite(qty)&&qty>0&&Number.isFinite(price)&&price>0&&Number.isFinite(actualAmt)&&actualAmt>0){
    const candidate={id:'preview',order:F_nextTradeOrder(st),date:document.getElementById('F_b_date')?.value||todayStr(),price,qty,amount:actualAmt};
    const preview=F_calcStock({...st,buyRecords:[...(st.buyRecords||[]),candidate]});
    box.style.display='';
    qtyEl.textContent=preview.valid===false?'请检查交易日期':preview.holdQty+'股';
    avgEl.textContent=preview.valid===false?'—':F_fmtY(preview.avgCost);
  }else{
    box.style.display='none';qtyEl.textContent='—';avgEl.textContent='—';
  }
}
function F_calcSellProfit(){
  const st=F_STOCK_ACCOUNT.stocks.find(s=>s.id===F_editId);if(!st)return;
  const box=document.getElementById('F_sell_calc');if(!box)return;
  const record={id:'preview',order:F_nextTradeOrder(st),...F_readTrade('F_s_')};
  if(!document.getElementById('F_s_price')?.value||!document.getElementById('F_s_qty')?.value){box.style.display='none';return;}
  const sells=[...F_stockRecords(st,'sellRecords'),record];
  const cal=F_calcStock({...st,sellRecords:sells});
  const profit=cal.sellProfits[sells.length-1];
  box.style.display='';
  document.getElementById('F_sc_amt').textContent=Number.isFinite(record.amount)?F_fmtY(record.amount):'金额无效';
  document.getElementById('F_sc_profit').textContent=cal.valid?F_fmtPnl(profit):cal.errors[0];
  document.getElementById('F_sc_profit').className='f-calc-val f-pnl '+(cal.valid?F_pnlClass(profit):'zero');
  document.getElementById('F_sc_remain').textContent=cal.valid?cal.holdQty+'股':'待核对';
}

const F_PORT_COLORS=['#ff9800','#FFD700','#e53935','#1a5fd4'];// 基金橙 黄金黄 股票红 现金蓝
const F_PORT_NAMES=['基金','黄金','股票','现金'];

function F_getPortfolioMarket(){
  const s=F_ld();
  return s.portfolioMarket||{stock:null,fund:null,gold:null,updatedAt:''};
}
function F_savePortfolioMarket(d){
  const s=F_ld();s.portfolioMarket=d;F_sv(s);
}

function F_calcPortfolio(){
  const fundItems=F_ITEMS.filter(i=>i.group==='fund');
  const goldItems=F_ITEMS.filter(i=>i.group==='gold');
  const fundCost=fundItems.reduce((s,i)=>s+F_getTotalInvested(i),0);
  const goldCost=goldItems.reduce((s,i)=>s+F_getTotalInvested(i),0);
  // 股票成本=初始资金+追加资金（固定资金池）
  const stockCost=F_calcAccount().totalIn;
  // 现金安全垫余额
  const cashItem=F_ITEMS.find(i=>i.name==='现金安全垫')||F_ITEMS.find(i=>i.group==='saving');
  const cashCost=cashItem?F_getTotalInvested(cashItem):0;
  const mkt=F_getPortfolioMarket();
  const stockMkt=mkt.stock!=null?mkt.stock:stockCost;
  const fundMkt=mkt.fund!=null?mkt.fund:fundCost;
  const goldMkt=mkt.gold!=null?mkt.gold:goldCost;
  const cashMkt=mkt.cash!=null?mkt.cash:cashCost;
  const costs=[fundCost,goldCost,stockCost,cashCost];
  const mkts=[fundMkt,goldMkt,stockMkt,cashMkt];
  const totalCost=costs.reduce((a,b)=>a+b,0);
  const totalMkt=mkts.reduce((a,b)=>a+b,0);
  return{costs,mkts,totalCost,totalMkt,updatedAt:mkt.updatedAt};
}

function F_renderPortfolioSection(){
  const p=F_calcPortfolio();

  const mktPcts=mkts.map(v=>totalMkt>0?Math.round(v/totalMkt*100):25);
  const rows=F_PORT_NAMES.map((name,i)=>{
    const pnl=mkts[i]-costs[i];

    return`<div class="f-portfolio-row">

      <span class="f-portfolio-mkt">${F_fmtY(mkts[i])}<br><span style="font-size:10px;color:#bbb">${mktPcts[i]}%</span></span>
      <span class="f-portfolio-pnl f-pnl ${F_pnlClass(pnl)}">${F_fmtPnl(pnl)}<br><span style="font-size:10px">${pnl>0?'+':''}${pnlPct.toFixed(1)}%</span></span>
    </div>`;
  }).join('');
  return`<div class="f-portfolio" id="F_portfolio_card">
    <div class="f-portfolio-title">
      <span class="f-portfolio-h">🥧 资产配置</span>
      <span class="f-portfolio-update">${escHtml(updatedAt?'市值更新于 '+updatedAt:'市值待更新')}</span>

        <canvas id="F_pie_cost" width="130" height="130"></canvas>
      </div>
      <div style="text-align:center;">
        <div class="f-pie-label">当前市值</div>
        <canvas id="F_pie_mkt" width="130" height="130"></canvas>

      <span>总成本 ${F_fmtY(totalCost)}</span>

      <span class="f-pnl ${F_pnlClass(totalMkt-totalCost)}" style="font-weight:600">${F_fmtPnl(totalMkt-totalCost)} (${totalCost>0?((totalMkt-totalCost)/totalCost*100).toFixed(1):0}%)</span>

function F_drawPortfolioPies(){
  setTimeout(()=>{
    if(_currentTab!=='finance'||F_modal)return;
    const p=F_calcPortfolio();
    const labelPlugin={
      id:'pieLabels',
      afterDraw(chart){
        const{ctx,data}=chart;
        const total=data.datasets[0].data.reduce((a,b)=>a+b,0);
        if(total===0)return;
        chart.getDatasetMeta(0).data.forEach((arc,i)=>{
          const val=data.datasets[0].data[i];
          const pct=Math.round(val/total*100);
          if(pct<8)return;
          const angle=(arc.startAngle+arc.endAngle)/2;
          const r=arc.outerRadius*0.62;
          const x=arc.x+Math.cos(angle)*r;
          const y=arc.y+Math.sin(angle)*r;
          ctx.save();
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#fff';
          ctx.font='bold 10px -apple-system,sans-serif';
          ctx.fillText(data.labels[i],x,y-6);
          ctx.font='10px -apple-system,sans-serif';
          ctx.fillText(pct+'%',x,y+6);
          ctx.restore();
        });
      }
    };
    ['cost','mkt'].forEach(type=>{
      const canvas=document.getElementById('F_pie_'+type);
      if(!canvas||!window.Chart)return;
      const data=type==='cost'?p.costs:p.mkts;
      const chart=replaceChart(canvas,{
        type:'pie',
        data:{labels:F_PORT_NAMES,datasets:[{data,backgroundColor:F_PORT_COLORS,borderWidth:2,borderColor:'#fff'}]},
        options:{
          plugins:{legend:{display:false},tooltip:{enabled:false}},
          animation:{duration:400}
        },
        plugins:[labelPlugin]
      });
      canvas._chartInstance=chart;
    });
  },150);
}

function F_autoInvest(){
  const asOf=todayStr();
  const mk=asOf.slice(0,7);
  let changed=false;
  F_ITEMS.forEach(item=>{
    if(!item.autoInvest)return;
    const sinceDate=new Date((item.autoInvestSince||'')+'T00:00:00');
    // 旧数据没有启用日期时只从当前月开始，绝不推测过去是否启用。
    if(!/^\d{4}-\d{2}-\d{2}$/.test(item.autoInvestSince||'')||!Number.isFinite(sinceDate.getTime())||dateStr(sinceDate)!==item.autoInvestSince){
      item.autoInvestSince=mk+'-01';item.autoInvestCheckedMonth=null;changed=true;
    }
    const firstMonth=item.autoInvestSince.slice(0,7);
    let month=firstMonth;
    if(/^\d{4}-(0[1-9]|1[0-2])$/.test(item.autoInvestCheckedMonth||'')&&item.autoInvestCheckedMonth>=firstMonth&&item.autoInvestCheckedMonth<=mk)month=nextMonth(item.autoInvestCheckedMonth);
    const investDay=Number.isInteger(Number(item.investDay))&&Number(item.investDay)>=1&&Number(item.investDay)<=31?Number(item.investDay):16;
    const monthly=Number(item.monthly);
    if(!Array.isArray(item.records)){item.records=[];changed=true;}
    while(month<=mk){
      const[y,m]=month.split('-').map(Number);
      const investDate=dateStr(settleDate(y,m-1,investDay));
      if(investDate>asOf)break;
      const alreadyDone=item.records.some(r=>r.type==='auto'&&typeof r.date==='string'&&r.date.startsWith(month));
      if(investDate>=item.autoInvestSince&&Number.isFinite(monthly)&&monthly>0&&!F_isCompleted(item)&&!alreadyDone){
        item.records.push({date:investDate,amount:monthly,note:'🤖 自动定投',type:'auto',returned:false});
      }
      item.autoInvestCheckedMonth=month;changed=true;
      month=nextMonth(month);
    }
  });
  if(changed)F_saveData();
}

    <div class="f-field-row"><span class="f-field-label">实际到账</span><input id="F_es_amt" type="number" step="0.01" value="${escHtml(r.amount??'')}"></div>
    <div class="f-field-row"><span class="f-field-label">备注</span><input id="F_es_note" value="${escHtml(r.note||'')}"></div>
    <div class="f-info-box">保存后按交易顺序重新计算相关盈亏。修改日期或股数不能导致历史持仓为负。</div>
    <button class="f-btn-primary" onclick="F_submitEditSellRecord(${jsAttr(st.id)},${idx})">保存</button>
    <button class="f-btn-danger" onclick="F_deleteSellRecord(${jsAttr(st.id)},${idx})">删除这笔卖出</button></div>`;
  document.getElementById('panel-finance').appendChild(ov);
}
function F_calcEditSellAmount(){
  const price=Number(document.getElementById('F_es_price')?.value),qty=Number(document.getElementById('F_es_qty')?.value);
  const amount=price*qty;
  if(Number.isFinite(amount)&&price>0&&Number.isSafeInteger(qty)&&qty>0)document.getElementById('F_es_amt').value=amount.toFixed(2);
}
function F_submitEditSellRecord(stId,recIdx){
  const st=F_STOCK_ACCOUNT.stocks.find(s=>s.id===stId);if(!st)return;
  const sells=F_stockRecords(st,'sellRecords').slice();
  if(!Number.isInteger(recIdx)||recIdx<0||recIdx>=sells.length)return;
  sells[recIdx]={...sells[recIdx],...F_readTrade('F_es_',true)};
  if(!F_applyStockTrades(st,{...st,buyRecords:F_stockRecords(st,'buyRecords'),sellRecords:sells},true))return;
  F_saveData();F_modal='stock-detail';F_renderMain();showToast_f('✓ 卖出记录已更新');
}
function F_deleteSellRecord(stId,recIdx){
  const st=F_STOCK_ACCOUNT.stocks.find(s=>s.id===stId);if(!st)return;
  const sells=F_stockRecords(st,'sellRecords').slice();
  if(!Number.isInteger(recIdx)||recIdx<0||recIdx>=sells.length)return;
  if(!confirm('确认删除这笔卖出记录？相关持仓、资金和盈亏将重新计算。'))return;
  const removed=sells.splice(recIdx,1)[0];
  if(!F_applyStockTrades(st,{...st,buyRecords:F_stockRecords(st,'buyRecords'),sellRecords:sells},true))return;
  if(removed?.planId&&!sells.some(r=>r?.planId===removed.planId)){
    const plan=F_stockRecords(st,'tpPlans').find(p=>p.id===removed.planId);if(plan)plan.done=false;
  }
  F_saveData();F_modal='stock-detail';F_renderMain();showToast_f('✓ 卖出记录已删除');
}
function F_openData(){F_modal='data-f';F_renderMain();}
function showToast_f(msg){
  const el=document.createElement('div');
  el.style.cssText='position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;pointer-events:none;white-space:nowrap;';
  el.textContent=msg;
  document.getElementById('panel-finance').appendChild(el);
  setTimeout(()=>el.remove(),1800);
}

// ─── 启动 ───
(function(){
  try{
    const s=ld();
    if(s.setupDone){
      ST=s.settings||{purpose:'budget',budget:50,settleDay:1,carryover:'yes',income_merge:'yes',hasExtra:false,extraAmount:0,show_reimb:'no',decimals:'2'};
      RC=s.records||[];RM=s.reimbs||[];
      showApp();
    }else{
      qStep=0;qAns={};showQuiz();
    }
  }catch(e){console.error('diary init error:',e.message,e.stack);}
  setTimeout(function(){
    try{M_loadData();}catch(e){console.error('M_loadData:',e.message,e.stack);}
    try{M_renderMain();}catch(e){console.error('M_renderMain:',e.message,e.stack);}
    try{F_loadData();}catch(e){console.error('F_loadData:',e.message,e.stack);}
    try{F_renderMain();}catch(e){console.error('F_renderMain:',e.message,e.stack);}
  },100);
})();
</script>
