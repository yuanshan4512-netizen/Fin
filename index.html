  ov.innerHTML=`<div class="f-sheet"><div class="f-sheet-handle"></div><div class="f-sheet-title">${row?'编辑账户':'添加账户'}</div><div class="f-sheet-sub">记录当前余额，可随时更新</div>
    <div class="f-field-row"><span class="f-field-label">账户名称</span><input id="F_dc_name" style="min-width:0" maxlength="40" placeholder="如银行卡、微信" value="${escHtml(row?.name||'')}"></div>
    <div class="f-field-row"><span class="f-field-label">当前余额</span><input id="F_dc_balance" style="min-width:0" type="number" inputmode="decimal" min="0" max="${F_DAILY_CASH_LIMIT}" step="0.01" placeholder="0.00" value="${escHtml(row?row.balance:'')}"></div>
    <div class="f-sheet-sub" style="line-height:1.7;margin:12px 0">只填用于生活的余额，已计入储蓄或证券的钱不用再填。</div>
    <button type="button" class="f-btn-primary" onclick="F_submitDailyCashEdit()">保存</button>
    <button type="button" class="f-btn-secondary" onclick="F_openDailyCash()">取消</button>
    ${row?`<button type="button" class="f-btn-danger" onclick="${row.hidden?'F_restoreDailyCashAccount':'F_deleteDailyCashAccount'}(${jsAttr(state.id)})">${row.hidden?'恢复显示此账户':'隐藏此账户'}</button>`:''}</div>`;
  document.getElementById('panel-finance').appendChild(ov);

function F_dailyCashWrite(finance,rows){
  let next={...finance,dailyCashAccounts:rows};
  try{backupSafeTree(next);F_dailyCashValidateRows(rows);validateFinanceBackup(next);}catch(e){throw F_dailyCashError('READ');}
  next=F_withCurrentAssetSnapshot(next);
  try{writeAppStorageTransaction({finance_v1:JSON.stringify(next)});}catch(e){throw F_dailyCashError('STORAGE');}
}
function F_dailyCashAfterWrite(message){
  F_dailyCashEditState=null;F_modal='daily-cash';
  try{F_loadData();F_renderMain();showToast_f(message);return true;}catch(e){alert(message+'；页面刷新未完成，请重新打开财务页。');return false;}
}
function F_submitDailyCashEdit(){
  const state=F_dailyCashEditState;
  try{
    if(!state)throw F_dailyCashError('CONFLICT');
    const name=String(document.getElementById('F_dc_name')?.value??'').trim();
    const rawBalance=String(document.getElementById('F_dc_balance')?.value??'').trim(),balance=Number(rawBalance);
    if(!name||name.length>40||rawBalance===''||!Number.isFinite(balance)||balance<0||balance>F_DAILY_CASH_LIMIT)throw F_dailyCashError('INVALID');
    // This read and write are synchronous; other accounts and all unrelated finance fields come from the latest storage.
    const{finance,rows}=F_dailyCashRead();
    const nextRows=rows.slice();
    if(state.id===null){
      let id=F_genId(),attempts=0;
      while(nextRows.some(row=>row.id===id)&&attempts++<10)id=F_genId();
      if(nextRows.some(row=>row.id===id))throw F_dailyCashError('CONFLICT');
      nextRows.push({id,name,balance,updatedAt:todayStr()});
    }else{
      const index=nextRows.findIndex(row=>row.id===state.id);
      if(index<0||F_dailyCashCanonical(nextRows[index])!==state.baseline)throw F_dailyCashError('CONFLICT');
      nextRows[index]={...nextRows[index],name,balance,updatedAt:todayStr()};
    }
    F_dailyCashWrite(finance,nextRows);
    return{ok:true,displayOk:F_dailyCashAfterWrite('✓ 日常资金已保存')};
  }catch(e){const code=e.dailyCashCode||'READ';alert(F_dailyCashMessage(code));return{ok:false,code};}
}
function F_deleteDailyCashAccount(id){
  const expected=F_dailyCashEditState?.id===id?F_dailyCashEditState.baseline:F_dailyCashListSnapshots.get(id);
  return F_setFinanceHidden('daily',id,null,true,expected??null,'daily-cash');
}

// Visibility is separate from accounting. Every calculation and backup keeps the original arrays.
let F_hideBaselines=new Map(),F_hideParentsBaseline=null,F_tmpTpBaseline=null,F_tmpTpOriginalCount=0;
function F_hideCanonical(value){
  if(Array.isArray(value))return'['+value.map(F_hideCanonical).join(',')+']';
  if(value&&typeof value==='object')return'{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+F_hideCanonical(value[k])).join(',')+'}';
  return JSON.stringify(value);
}
function F_hideKey(kind,id,index){return JSON.stringify([kind,id??null,index??null]);}
function F_hideRead(){
  const raw=localStorage.getItem('finance_v1');
  const f=raw===null?{}:JSON.parse(raw);
  backupSafeTree(f);validateFinanceBackup(f);return f;
}
function F_hideResolve(f,kind,id,index){
  if(kind==='item')return(f.items||[]).find(r=>r.id===id);
  if(kind==='stock')return(f.stockAccount?.stocks||[]).find(r=>r.id===id);
  if(kind==='daily')return(f.dailyCashAccounts||[]).find(r=>r.id===id);
  if(kind==='deposit')return(f.stockAccount?.deposits||[])[index];
  if(kind==='record')return((f.items||[]).find(r=>r.id===id)?.records||[])[index];
  const stock=(f.stockAccount?.stocks||[]).find(r=>r.id===id);
  return stock?.[{buy:'buyRecords',sell:'sellRecords',plan:'tpPlans'}[kind]]?.[index];
}
function F_captureHideBaselines(){
  const map=new Map(),remember=(kind,id,index,row)=>map.set(F_hideKey(kind,id,index),F_hideCanonical(row));
  for(const item of F_ITEMS){remember('item',item.id,null,item);(item.records||[]).forEach((r,i)=>remember('record',item.id,i,r));}
  for(const stock of F_STOCK_ACCOUNT.stocks||[]){remember('stock',stock.id,null,stock);for(const[kind,key]of[['buy','buyRecords'],['sell','sellRecords'],['plan','tpPlans']])(stock[key]||[]).forEach((r,i)=>remember(kind,stock.id,i,r));}
  (F_STOCK_ACCOUNT.deposits||[]).forEach((r,i)=>remember('deposit',null,i,r));
  let daily=null;try{daily=F_dailyCashRead().rows;daily.forEach(r=>remember('daily',r.id,null,r));}catch(e){}
  F_hideBaselines=map;
  F_hideParentsBaseline=daily===null?null:F_hideCanonical({items:F_ITEMS,stocks:F_STOCK_ACCOUNT.stocks||[],daily});
}
function F_hideWrite(finance){
  backupSafeTree(finance);validateFinanceBackup(finance);
  writeAppStorageTransaction({finance_v1:JSON.stringify(finance)});
}
function F_hideRefresh(message,nextModal){
  if(nextModal!==undefined)F_modal=nextModal;
  try{F_loadData();F_renderMain();showToast_f(message);return true;}catch(e){alert(message+'；请重新打开财务页查看。');return false;}
}
function F_setFinanceHidden(kind,id,index,hidden,expected=null,nextModal){
  try{
    if(!['item','stock','daily','deposit','record','buy','sell','plan'].includes(kind)||typeof hidden!=='boolean')return{ok:false,code:'INVALID'};
    const baseline=expected??F_hideBaselines.get(F_hideKey(kind,id,index));
    const finance=F_hideRead(),row=F_hideResolve(finance,kind,id,index);
    if(!baseline||!row||F_hideCanonical(row)!==baseline){alert('这条记录已被修改或删除，请重新打开后再操作。');return{ok:false,code:'CONFLICT'};}
    if(!!row.hidden===hidden)return{ok:true,unchanged:true};
    row.hidden=hidden;F_hideWrite(finance);
    return{ok:true,displayOk:F_hideRefresh(hidden?'✓ 已隐藏，资金和记录仍保留':'✓ 已恢复显示',nextModal)};
  }catch(e){alert('未能保存显示状态，请检查本机数据和存储空间；原记录及保存前恢复副本会尽可能保留。');return{ok:false,code:'STORAGE'};}
}
function F_hiddenEntries(){
  const result=[],add=(kind,id,index,row,parentName,label)=>{if(row?.hidden)result.push({kind,id,index,row,parentName,label});};
  for(const item of F_ITEMS){add('item',item.id,null,item,'',item.name);(item.records||[]).forEach((r,i)=>add('record',item.id,i,r,item.name,r.type==='note'?'变更记录':r.type==='withdraw'?'取用记录':r.type==='auto'?'自动定投':'存入记录'));}

// Monthly observations use the same book-value basis as the asset overview.
// This module never captures from rendering, import, export or a generic storage hook.
function F_assetSum(values){
  let total=0;
  for(const value of values){
    if(typeof value!=='number'||!Number.isFinite(value))return null;
    const cents=Math.round(value*100);
    if(!Number.isSafeInteger(cents)||!Number.isSafeInteger(total+cents))return null;
    total+=cents;
  }
  return total/100;
}
function F_calcAssetOverviewFromFinance(finance){
  const f=finance&&typeof finance==='object'&&!Array.isArray(finance)?finance:{items:null,stockAccount:null,dailyCashAccounts:null};
  const groupTotal=group=>{try{
    const items=f.items===undefined?[]:f.items;if(!Array.isArray(items))return null;
    const selected=items.filter(item=>item&&item.group===group&&(group!=='saving'||(typeof item.name==='string'&&item.name.trim()==='现金安全垫')));
    // Other saving projects keep their history but are outside this asset overview.
    if(group==='saving'&&selected.length>1)return null;
    return F_assetSum(selected.map(F_getTotalInvested));
  }catch(e){return null;}};
  const fund=groupTotal('fund'),gold=groupTotal('gold'),saving=groupTotal('saving');
  let stock=null,daily=null,dailyCount=0;
  try{
    const account=f.stockAccount===undefined?{initialCapital:0,deposits:[],stocks:[]}:f.stockAccount;
    if(!account||typeof account.initialCapital!=='number'||!Number.isFinite(account.initialCapital)||!Array.isArray(account.deposits)||!Array.isArray(account.stocks))throw 0;
    const deposits=account.deposits.map(row=>row.amount);
    if(deposits.some(value=>typeof value!=='number'||!Number.isFinite(value)))throw 0;
    const stocks=account.stocks.map(F_calcStock);if(stocks.some(cal=>!cal.valid))throw 0;
    const available=account.initialCapital+deposits.reduce((n,value)=>n+value,0)-stocks.reduce((n,cal)=>n+cal.totalCost,0)+stocks.reduce((n,cal)=>n+cal.totalSoldAmt,0);
    stock=F_assetSum([available,stocks.reduce((n,cal)=>n+cal.holdCost,0)]);
  }catch(e){}
  try{
    const rows=f.dailyCashAccounts===undefined?[]:f.dailyCashAccounts;
    F_dailyCashValidateRows(rows);daily=F_assetSum(rows.map(row=>row.balance));dailyCount=rows.length;
  }catch(e){}
  const storedAssets=F_assetSum([stock,fund,gold,saving]),total=F_assetSum([stock,fund,gold,saving,daily]);
  return{fund,gold,saving,stock,daily,dailyCount,storedAssets,total,valid:total!==null};
}
function F_assetBeijingDate(value=new Date()){
  const time=new Date(value).getTime();if(!Number.isFinite(time))throw new Error('记录时间无效');
  return new Date(time+8*60*60*1000).toISOString().slice(0,10);
}
function F_validateAssetSnapshots(finance){
  if(!Object.prototype.hasOwnProperty.call(finance,'assetSnapshots'))return;
  const rows=finance.assetSnapshots;if(!Array.isArray(rows))throw new Error('月度资产记录格式无效');
  const months=new Set();
  for(const row of rows){
    if(!row||typeof row!=='object'||Array.isArray(row)||!['book-v1','book-cash-cushion-v2'].includes(row.basis)||!F_validGoldMonth(row.month)||months.has(row.month+'|'+row.basis)||!Number.isSafeInteger(row.totalCents)||typeof row.capturedAt!=='string')throw new Error('月度资产记录无效');
    const date=new Date(row.capturedAt);
    if(!Number.isFinite(date.getTime())||date.toISOString()!==row.capturedAt||F_assetBeijingDate(date).slice(0,7)!==row.month)throw new Error('月度资产日期无效');
    months.add(row.month+'|'+row.basis);
  }
}
function F_withCurrentAssetSnapshot(finance,now=new Date()){
  F_validateAssetSnapshots(finance);
  const overview=F_calcAssetOverviewFromFinance(finance);if(!overview.valid)return finance;
  const capturedAt=new Date(now).toISOString(),month=F_assetBeijingDate(now).slice(0,7),totalCents=Math.round(overview.total*100);
  if(!Number.isSafeInteger(totalCents))return finance;
  const previous=finance.assetSnapshots||[],old=previous.find(row=>row.month===month&&row.basis==='book-cash-cushion-v2');
  if(previous.some(row=>row.month>month))return finance;
  if(old&&(old.capturedAt>capturedAt||(old.capturedAt===capturedAt&&old.totalCents===totalCents&&old.basis==='book-cash-cushion-v2')))return finance;
  const row={...old,month,capturedAt,basis:'book-cash-cushion-v2',totalCents};
  return{...finance,assetSnapshots:[...previous.filter(value=>value!==old),row].sort((a,b)=>a.month.localeCompare(b.month)||a.capturedAt.localeCompare(b.capturedAt)||Number(a.basis==='book-cash-cushion-v2')-Number(b.basis==='book-cash-cushion-v2'))};
}
function F_assetReadFinance(){
  const raw=localStorage.getItem(F_SK),finance=raw===null?{}:JSON.parse(raw);
  if(!finance||typeof finance!=='object'||Array.isArray(finance))throw new Error('本机财务记录无法读取');
  backupSafeTree(finance);return finance;
}
function F_assetMonthNumber(month){return Number(month.slice(0,4))*12+Number(month.slice(5,7))-1;}
function F_assetHistoryRows(finance){
  F_validateAssetSnapshots(finance);
  return (finance.assetSnapshots||[]).slice().sort((a,b)=>a.month.localeCompare(b.month)||a.capturedAt.localeCompare(b.capturedAt)||Number(a.basis==='book-cash-cushion-v2')-Number(b.basis==='book-cash-cushion-v2')).map((row,index,rows)=>{
    const previous=rows[index-1],sameBasis=!!previous&&previous.basis===row.basis,difference=sameBasis?row.totalCents-previous.totalCents:null;
    return{...row,date:F_assetBeijingDate(row.capturedAt),previousMonth:previous?previous.month:null,
      basisChanged:!!previous&&!sameBasis,
      adjacent:sameBasis&&F_assetMonthNumber(row.month)-F_assetMonthNumber(previous.month)===1,
      deltaCents:Number.isSafeInteger(difference)?difference:null};
  });
}
function F_assetHistoryChart(rows){
  if(!rows.length)return'';
  if(new Set(rows.map(row=>row.month)).size<2)return'<div class="f-sheet-sub" style="line-height:1.7;margin:16px 0">积累两个月记录后显示变化趋势</div>';
  const width=320,height=150,left=44,right=12,top=16,bottom=28;
  const first=F_assetMonthNumber(rows[0].month),last=F_assetMonthNumber(rows[rows.length-1].month);
  const values=rows.map(row=>row.totalCents/100),min=Math.min(...values),max=Math.max(...values);
  const padding=Math.max(max===min?Math.abs(max)*0.05:(max-min)*0.1,1),upper=max+padding,lower=min-padding;
  const x=row=>left+(last===first?0.5:(F_assetMonthNumber(row.month)-first)/(last-first))*(width-left-right);
  const y=row=>top+(upper-row.totalCents/100)/(upper-lower)*(height-top-bottom);
  const segments=[],dots=[];
  rows.forEach((row,index)=>{
    const px=x(row),py=y(row);dots.push(`<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="2.5" fill="#3462a0"><title>${escHtml(row.month+' '+F_fmtY(row.totalCents/100)+(row.basis==='book-v1'?'（旧范围：包含全部储蓄项目）':'（储蓄仅现金安全垫）'))}</title></circle>`);
    if(index&&row.adjacent&&rows[index-1].basis===row.basis){const prior=rows[index-1];segments.push(`<path d="M ${x(prior).toFixed(2)} ${y(prior).toFixed(2)} L ${px.toFixed(2)} ${py.toFixed(2)}" fill="none" stroke="#3462a0" stroke-width="1.5"/>`);}
  });
  return`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="每月最后一次记录的总资产，缺少记录的月份不连线" style="width:100%;height:auto;display:block"><path d="M ${left} ${top} V ${height-bottom} H ${width-right}" fill="none" stroke="#e4e9ef" stroke-width="1"/><text x="${left-5}" y="${top+3}" text-anchor="end" font-size="9" fill="#8390a0">${escHtml(F_fmtAsset(upper))}</text><text x="${left-5}" y="${height-bottom+3}" text-anchor="end" font-size="9" fill="#8390a0">${escHtml(F_fmtAsset(lower))}</text>${segments.join('')}${dots.join('')}<text x="${left}" y="${height-7}" font-size="10" fill="#8390a0">${escHtml(rows[0].month)}</text>${rows.length>1?`<text x="${width-right}" y="${height-7}" text-anchor="end" font-size="10" fill="#8390a0">${escHtml(rows[rows.length-1].month)}</text>`:''}</svg>`;
}

function F_checkModal(){

  else if(F_modal==='stock-detail')F_renderStockDetailModal();

}
function mkOv_f(){
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.style.cssText='position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:flex-end;z-index:100;';
  ov.addEventListener('click',e=>{if(e.target===ov){F_modal=null;F_editId=null;F_editSub=null;F_renderMain();}});
  return ov;
}

function F_submitItemEdit(id){
  const idx=F_ITEMS.findIndex(i=>i.id===id);if(idx<0)return;
  const old=F_ITEMS[idx];
  const newName=document.getElementById('e-name')?.value.trim()||old.name;
  const newTarget=Number(document.getElementById('e-target')?.value);
  const newInvested=Number(document.getElementById('e-invested')?.value);
  const newMonthly=Number(document.getElementById('e-monthly')?.value);
  const newAutoInvest=document.getElementById('F_e_auto')?.value==='1';
  const newInvestDay=Number(document.getElementById('F_e_invest_day')?.value);
  if(!Number.isFinite(newTarget)||newTarget<=0||!Number.isFinite(newInvested)||newInvested<0||!Number.isFinite(newMonthly)||newMonthly<0||!Number.isInteger(newInvestDay)||newInvestDay<1||newInvestDay>31){alert('请输入正数目标金额、非负投入金额和1至31号定投日');return;}
  // 先按旧计划处理已到期月份，避免新金额改写过去的自动记录。
  F_autoInvest();
  const newPlatform=document.getElementById('e-platform')?.value.trim()||'';
  const newNote=document.getElementById('e-note')?.value.trim()||'';
  const newGroup=document.getElementById('e-group')?.value||old.group;
  // 记录变更
  if(!F_ITEMS[idx].records)F_ITEMS[idx].records=[];
  const changes=[];
  if(newTarget!==old.target)changes.push(`目标 ${F_fmtY(old.target)}→${F_fmtY(newTarget)}`);
  if(newMonthly!==old.monthly)changes.push(`月投 ${F_fmtY(old.monthly)}→${F_fmtY(newMonthly)}`);
  if(Math.abs(newInvested-old.invested)>0.01)changes.push(`初始投入 ${F_fmtY(old.invested)}→${F_fmtY(newInvested)}`);
  if(changes.length){
    F_ITEMS[idx].records.push({date:todayStr(),amount:0,note:'📝 '+changes.join('；'),type:'note',returned:false});
  }
  const scheduleChanged=newAutoInvest!==!!old.autoInvest||newMonthly!==old.monthly||newInvestDay!==(old.investDay||16);
  const schedule=scheduleChanged?{autoInvestSince:newAutoInvest?todayStr():null,autoInvestCheckedMonth:null}:{};
  F_ITEMS[idx]={...F_ITEMS[idx],...schedule,name:newName,group:newGroup,target:newTarget,invested:newInvested,monthly:newMonthly,platform:newPlatform,note:newNote,autoInvest:newAutoInvest,investDay:newInvestDay};
  F_autoInvest();
  F_saveData({capture:newInvested!==old.invested});showToast_f('✓ 已保存');F_modal=null;F_editId=null;F_renderMain();
}

function F_exportData(){
  try{
    const data={app:'财务管家',schema:4,exportedAt:new Date().toISOString(),finance:JSON.parse(localStorage.getItem('finance_v1')||'{}'),financeVersions:FV_read()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    const d=new Date();
    a.download=`财务管家_财务总览_${d.getMonth()+1}月${d.getDate()}日${d.getFullYear()}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){alert('导出失败，请检查本地数据和浏览器存储权限');}
}
function F_importData(e){
  const input=e.target;const file=input.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{applyImportedState(JSON.parse(ev.target.result),'finance');}
    catch(err){alert(err.message||'导入未完成，请检查存储空间并核对本机记录，必要时可导入备份恢复。');return;}
    try{F_loadData();F_modal=null;F_renderMain();alert('✓ 财务总览已恢复');}
    catch(err){alert('财务数据已恢复，页面显示异常，请重新加载页面。');}
  };
  reader.onerror=()=>alert('读取文件失败，原数据未改动');
  reader.readAsText(file);input.value='';
}
function F_resetData(){
  const baseline=F_hideParentsBaseline;
  if(!confirm('隐藏全部财务项目和日常账户？资产、资金及完整记录仍保留，可在“已隐藏项目与记录”中恢复显示。'))return{ok:false,code:'CANCELLED'};
  try{
    const f=F_hideRead(),parents={items:f.items||[],stocks:f.stockAccount?.stocks||[],daily:f.dailyCashAccounts||[]};
    if(!baseline||F_hideCanonical(parents)!==baseline){alert('财务记录已变化，请重新打开财务页后再操作。');return{ok:false,code:'CONFLICT'};}
    const rows=[...parents.items,...parents.stocks,...parents.daily];
    if(rows.every(r=>r.hidden===true))return{ok:true,unchanged:true};
    rows.forEach(row=>{row.hidden=true;});F_hideWrite(f);
    return{ok:true,displayOk:F_hideRefresh('✓ 已隐藏全部项目，资产和记录仍保留',null)};
  }catch(e){alert('未能保存隐藏状态，请检查本机数据和存储空间。');return{ok:false,code:'STORAGE'};}
}

function F_calcBuyTotal(){
  const price=Number(document.getElementById('F_b_price')?.value);
  const qty=Number(document.getElementById('F_b_qty')?.value);
  const amt=document.getElementById('F_b_amt');
  if(amt&&!amt.dataset.manual){
    amt.value=Number.isFinite(price)&&price>0&&Number.isFinite(qty)&&qty>0?(price*qty).toFixed(2):'';
  }
  F_calcBuyAvg();
}
function F_calcBuyAvg(){
  const st=F_STOCK_ACCOUNT.stocks.find(s=>s.id===F_editId);if(!st)return;
  const qty=Number(document.getElementById('F_b_qty')?.value);
  const rawAmount=document.getElementById('F_b_amt')?.value;
  const price=Number(document.getElementById('F_b_price')?.value);
  const actualAmt=rawAmount!=null&&rawAmount.trim()!==''?Number(rawAmount):price*qty;
  const box=document.getElementById('F_buy_calc');
  const qtyEl=document.getElementById('F_bc_qty');
  const avgEl=document.getElementById('F_bc_avg');
  if(!box||!qtyEl||!avgEl)return;
  if(Number.isFinite(qty)&&qty>0&&Number.isFinite(price)&&price>0&&Number.isFinite(actualAmt)&&actualAmt>0){
    const candidate={id:'preview',order:F_nextTradeOrder(st),date:document.getElementById('F_b_date')?.value||todayStr(),price,qty,amount:actualAmt};
    const preview=F_calcStock({...st,buyRecords:[...(st.buyRecords||[]),candidate]});
    box.style.display='';
    qtyEl.textContent=preview.valid===false?'请检查交易日期':preview.holdQty+'股';
    avgEl.textContent=preview.valid===false?'—':F_fmtY(preview.avgCost);
  }else{
    box.style.display='none';qtyEl.textContent='—';avgEl.textContent='—';
  }
}
function F_calcSellProfit(){
  const st=F_STOCK_ACCOUNT.stocks.find(s=>s.id===F_editId);if(!st)return;
  const box=document.getElementById('F_sell_calc');if(!box)return;
  const record={id:'preview',order:F_nextTradeOrder(st),...F_readTrade('F_s_')};
  if(!document.getElementById('F_s_price')?.value||!document.getElementById('F_s_qty')?.value){box.style.display='none';return;}
  const sells=[...F_stockRecords(st,'sellRecords'),record];
  const cal=F_calcStock({...st,sellRecords:sells});
  const profit=cal.sellProfits[sells.length-1];
  box.style.display='';
  document.getElementById('F_sc_amt').textContent=Number.isFinite(record.amount)?F_fmtY(record.amount):'金额无效';
  document.getElementById('F_sc_profit').textContent=cal.valid?F_fmtPnl(profit):cal.errors[0];
  document.getElementById('F_sc_profit').className='f-calc-val f-pnl '+(cal.valid?F_pnlClass(profit):'zero');
  document.getElementById('F_sc_remain').textContent=cal.valid?cal.holdQty+'股':'待核对';
}

// ─── 资产配置 & 自动定投 ───
const F_PORT_COLORS=['#ff9800','#FFD700','#e53935','#1a5fd4'];// 基金橙 黄金黄 股票红 现金蓝
const F_PORT_NAMES=['基金','黄金','股票','现金'];

function F_getPortfolioMarket(){
  const s=F_ld();
  return s.portfolioMarket||{stock:null,fund:null,gold:null,updatedAt:''};
}
function F_savePortfolioMarket(d){
  const s=F_ld();s.portfolioMarket=d;F_sv(s);
}

function F_calcPortfolio(){
  const fundItems=F_ITEMS.filter(i=>i.group==='fund');
  const goldItems=F_ITEMS.filter(i=>i.group==='gold');
  const fundCost=fundItems.reduce((s,i)=>s+F_getTotalInvested(i),0);
  const goldCost=goldItems.reduce((s,i)=>s+F_getTotalInvested(i),0);
  // 股票成本=初始资金+追加资金（固定资金池）
  const stockCost=F_calcAccount().totalIn;
  // 现金安全垫余额
  const cashItem=F_ITEMS.find(i=>i.name==='现金安全垫')||F_ITEMS.find(i=>i.group==='saving');
  const cashCost=cashItem?F_getTotalInvested(cashItem):0;
  const mkt=F_getPortfolioMarket();
  const stockMkt=mkt.stock!=null?mkt.stock:stockCost;
  const fundMkt=mkt.fund!=null?mkt.fund:fundCost;
  const goldMkt=mkt.gold!=null?mkt.gold:goldCost;
  const cashMkt=mkt.cash!=null?mkt.cash:cashCost;
  const costs=[fundCost,goldCost,stockCost,cashCost];
  const mkts=[fundMkt,goldMkt,stockMkt,cashMkt];
  const totalCost=costs.reduce((a,b)=>a+b,0);
  const totalMkt=mkts.reduce((a,b)=>a+b,0);
  return{costs,mkts,totalCost,totalMkt,updatedAt:mkt.updatedAt};
}

function F_renderPortfolioSection(){
  const p=F_calcPortfolio();
  const{costs,mkts,totalCost,totalMkt,updatedAt}=p;
  const costState=moneyRingState(costs.map(amount=>({amount}))),mktState=moneyRingState(mkts.map(amount=>({amount})));
  const costPcts=costs.map(v=>costState.drawable?(v/totalCost*100).toFixed(1)+'%':'—');
  const mktPcts=mkts.map(v=>mktState.drawable?(v/totalMkt*100).toFixed(1)+'%':'—');
  const rows=F_PORT_NAMES.map((name,i)=>{
    const pnl=mkts[i]-costs[i];
    const pnlPct=costs[i]>0?pnl/costs[i]*100:0;
    return`<div class="f-portfolio-row">
      <div class="f-portfolio-dot" style="background:${F_PORT_COLORS[i]}"></div>
      <span class="f-portfolio-name">${name}</span>
      <span class="f-portfolio-cost">成本 ${F_fmtY(costs[i])}<br><span style="font-size:10px;color:#bbb">${costPcts[i]}</span></span>
      <span class="f-portfolio-mkt">${F_fmtY(mkts[i])}<br><span style="font-size:10px;color:#bbb">${mktPcts[i]}</span></span>
      <span class="f-portfolio-pnl f-pnl ${F_pnlClass(pnl)}">${F_fmtPnl(pnl)}<br><span style="font-size:10px">${pnl>0?'+':''}${pnlPct.toFixed(1)}%</span></span>
    </div>`;
  }).join('');
  return`<div class="f-portfolio" id="F_portfolio_card">
    <div class="f-portfolio-title">
      <span class="f-portfolio-h">🥧 资产配置</span>
      <span class="f-portfolio-update">${escHtml(updatedAt?'市值更新于 '+updatedAt:'市值待更新')}</span>
    </div>
    ${renderMoneyRing(F_PORT_NAMES.map((name,i)=>({name,amount:costs[i],color:F_PORT_COLORS[i]})),{label:'投入成本'})}
    ${renderMoneyRing(F_PORT_NAMES.map((name,i)=>({name,amount:mkts[i],color:F_PORT_COLORS[i]})),{label:'当前市值'})}
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-bottom:10px;padding:0 2px">

function F_autoInvest(){
  const asOf=todayStr();
  const mk=asOf.slice(0,7);
  let changed=false,addedMoney=false;
  F_ITEMS.forEach(item=>{
    if(!item.autoInvest)return;
    const sinceDate=new Date((item.autoInvestSince||'')+'T00:00:00');
    // 旧数据没有启用日期时只从当前月开始，绝不推测过去是否启用。
    if(!/^\d{4}-\d{2}-\d{2}$/.test(item.autoInvestSince||'')||!Number.isFinite(sinceDate.getTime())||dateStr(sinceDate)!==item.autoInvestSince){
      item.autoInvestSince=mk+'-01';item.autoInvestCheckedMonth=null;changed=true;
    }
    const firstMonth=item.autoInvestSince.slice(0,7);
    let month=firstMonth;
    if(/^\d{4}-(0[1-9]|1[0-2])$/.test(item.autoInvestCheckedMonth||'')&&item.autoInvestCheckedMonth>=firstMonth&&item.autoInvestCheckedMonth<=mk)month=nextMonth(item.autoInvestCheckedMonth);
    const investDay=Number.isInteger(Number(item.investDay))&&Number(item.investDay)>=1&&Number(item.investDay)<=31?Number(item.investDay):16;
    const monthly=Number(item.monthly);
    if(!Array.isArray(item.records)){item.records=[];changed=true;}
    while(month<=mk){
      const[y,m]=month.split('-').map(Number);
      const investDate=dateStr(settleDate(y,m-1,investDay));
      if(investDate>asOf)break;
      const alreadyDone=item.records.some(r=>r.type==='auto'&&typeof r.date==='string'&&r.date.startsWith(month));
      if(investDate>=item.autoInvestSince&&Number.isFinite(monthly)&&monthly>0&&!F_isCompleted(item)&&!alreadyDone){
        item.records.push({date:investDate,amount:monthly,note:'🤖 自动定投',type:'auto',returned:false});addedMoney=true;
      }
      item.autoInvestCheckedMonth=month;changed=true;
      month=nextMonth(month);
    }
  });
  if(changed)F_saveData({capture:addedMoney});
}

function CB_checkRepository(repo,c){

function CB_hasLedgerData(diary,monthly,finance){

  if(nonempty(monthly.bills)||nonempty(monthly.budgets)||nonempty(monthly.archivedUtilityBills))return true;
  if(monthly.billsStatus&&Object.values(monthly.billsStatus).some(v=>v&&typeof v==='object'&&Object.keys(v).length))return true;
  if(monthly.utility&&(Number(monthly.utility.balance)!==0&&Number.isFinite(Number(monthly.utility.balance))||monthly.utility.lastUpdate))return true;
  if(nonempty(finance.items)||nonempty(finance.dailyCashAccounts))return true;
  if(nonempty(finance.assetSnapshots))return true;
  const account=finance.stockAccount||{};
  if(nonempty(account.stocks)||nonempty(account.deposits))return true;
  if(Number.isFinite(account.initialCapital)&&account.initialCapital>=0&&account.initialCapital!==10000)return true;

function CB_buildSnapshot(c){
  const modules={};
  try{
    for(const[key,name]of[['bav7','diary'],['monthly_v1','monthly'],['finance_v1','finance']]){
      const raw=localStorage.getItem(key);
      const data=raw===null?{}:JSON.parse(raw);
      if(!data||typeof data!=='object'||Array.isArray(data))throw CB_error('INVALID');
      modules[name]=data;
    }
  }catch(e){throw CB_error('INVALID');}
  let financeVersions;try{financeVersions=FV_read();}catch(e){throw CB_error('INVALID');}
  if(!CB_hasLedgerData(modules.diary,modules.monthly,modules.finance)&&!financeVersions.versions.length)throw CB_error('EMPTY');
  const exportedAt=new Date().toISOString();
  const payload={app:'财务管家',schema:4,exportedAt,deviceLabel:c.deviceLabel,...modules,financeVersions};
  try{if(typeof prepareImportedState!=='function')throw CB_error('INVALID');prepareImportedState(payload,'all');}
  catch(e){throw CB_error('INVALID');}
  // Validation above is read-only. Export the original stored objects, not normalized defaults.
  const json=JSON.stringify(payload,null,2);
  if(json.includes(c.token))throw CB_error('SECRET');
  const bytes=new TextEncoder().encode(json);
  if(bytes.length>CB_MAX_BACKUP_BYTES)throw CB_error('SIZE');
  let binary='';for(let offset=0;offset<bytes.length;offset+=0x8000)binary+=String.fromCharCode(...bytes.subarray(offset,offset+0x8000));

}
function CB_newPath(exportedAt){

  const stamp=exportedAt.replace(/[-:.]/g,'');
  return'backups/'+exportedAt.slice(0,4)+'/'+exportedAt.slice(5,7)+'/finance-'+stamp+'-'+random+'-'+(++CB_nonceCounter).toString(36)+'.json';
}

function CB_uploadBackup(options={}){
  if(CB_uploadPromise)return CB_uploadPromise;
  const c=CB_readConfig(),revision=CB_revision;
  const task=async()=>{
    try{
      if(!CB_validTarget(c.owner,c.repo))throw CB_error('CONFIG');
      if(c.consent!==true||!CB_validToken(c.token))throw CB_error('TOKEN');
      CB_updateState(c,revision,{lastAttemptAt:new Date().toISOString(),lastError:''});
      CB_paintStatus('正在检查私有仓库…');
      const base='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo);
      const metadata=await CB_request(base,c,revision);
      const branch=CB_checkRepository(metadata,c);
      const snapshot=CB_buildSnapshot(c);
      const path=CB_newPath(snapshot.exportedAt);
      const fileUrl=base+'/contents/'+path.split('/').map(encodeURIComponent).join('/');
      CB_paintStatus('正在上传完整快照…');
      const uploaded=await CB_request(fileUrl,c,revision,{method:'PUT',body:JSON.stringify({message:'Finance backup · '+c.deviceLabel+' · '+snapshot.exportedAt,content:snapshot.content,branch})});
      const sha=uploaded.content?.sha;
      if(typeof sha!=='string'||!sha)throw CB_error('VERIFY');
      CB_paintStatus('正在核对远端文件…');
      let verified;
      try{verified=await CB_request(fileUrl+'?ref='+encodeURIComponent(branch),c,revision);}catch(e){if(e.cloudBackupCode==='CANCELLED')throw e;throw CB_error('VERIFY');}
      if(verified.sha!==sha)throw CB_error('VERIFY');
      const at=new Date().toISOString();
      CB_updateState(c,revision,{lastSuccessAt:at,lastSuccessTarget:CB_target(c),lastSuccessPath:path,lastSuccessSha:sha,lastSuccessBytes:snapshot.bytes,lastError:''});
      CB_paintStatus('备份成功，已核对远端文件。');CB_showToast('GitHub 私有云备份成功');
      return{ok:true,at,path,sha};
    }catch(error){
      const code=error&&error.cloudBackupCode||'UNKNOWN';
      const message=CB_errorMessage(code);
      if(code!=='CANCELLED')try{CB_updateState(c,revision,{lastError:message});}catch(e){}
      CB_paintStatus(message);
      if(code!=='CANCELLED')CB_showToast('云备份失败，请到数据 → GitHub 云备份查看');
      return{ok:false,code,error:message};
    }
  };
  CB_uploadPromise=Promise.resolve().then(task).finally(()=>{CB_uploadPromise=null;CB_paintStatus();});
  CB_paintStatus('准备备份…');
  return CB_uploadPromise;
}

// Weekly backups run when this browser is open; weeks start Monday in Beijing.
const CB_ATTEMPT_KEY='fin_cloud_backup_attempt_v1';
let CB_autoRunning=false;
function CB_weekKey(value=new Date()){
  const time=new Date(value).getTime();if(!Number.isFinite(time))return '';
  const day=new Date(time+8*60*60*1000);
  day.setUTCDate(day.getUTCDate()-(day.getUTCDay()+6)%7);
  return day.toISOString().slice(0,10);
}
async function CB_maybeAutoBackup(now=new Date()){
  if(CB_autoRunning)return {skipped:'busy'};
  if(document.visibilityState==='hidden'||navigator.onLine===false)return {skipped:'unavailable'};
  const time=new Date(now).getTime(),week=CB_weekKey(now);
  if(!Number.isFinite(time)||!week)return {skipped:'clock'};
  const run=async()=>{
    const status=CB_getStatus();
    if(!status.enabled||!status.hasCredentials)return {skipped:'disabled'};
    if(status.busy)return {skipped:'busy'};
    const target=(status.owner+'/'+status.repo).toLowerCase();
    if(String(status.lastSuccessTarget||'').toLowerCase()===target&&CB_weekKey(status.lastSuccessAt)===week)return {skipped:'done'};
    try{
      const attempt=JSON.parse(localStorage.getItem(CB_ATTEMPT_KEY)||'null');
      if(attempt?.target===target&&Number.isFinite(attempt.at)&&time>=attempt.at&&time-attempt.at<60*60*1000)return {skipped:'retry-later'};
      localStorage.setItem(CB_ATTEMPT_KEY,JSON.stringify({target,at:time}));
    }catch(e){return {skipped:'storage-unavailable'};}
    return await CB_uploadBackup({automatic:true});
  };
  CB_autoRunning=true;
  try{
    if(navigator.locks?.request)return await navigator.locks.request('fin-weekly-backup',{ifAvailable:true},lock=>lock?run():{skipped:'busy'});
    return await run();
  }catch(e){return {skipped:'failed'};}
  finally{CB_autoRunning=false;}
}
function CB_startAutoBackup(){
  const check=()=>{CB_maybeAutoBackup();};
  setTimeout(check,1500);
  window.addEventListener('pageshow',check);
  window.addEventListener('online',check);
  document.addEventListener('visibilitychange',check);
  window.addEventListener('storage',event=>{if(event.key==='fin_cloud_backup_v1')check();});
  setInterval(check,15*60*1000);
}

// Generic private-repository repair reader. No personal transaction data belongs here.
const CR_REPAIR_PATH='repairs/pending-stock.json';
const CR_REPAIR_TARGET='yuanshan4512-netizen/Fin-backups';
const CR_MAX_BYTES=64*1024;
let CR_pending=null,CR_openPromise=null,CR_applyPromise=null,CR_generation=0;
function CR_repairBusy(){return !!(CB_uploadPromise||(typeof GR_isBusy==='function'&&GR_isBusy()));}
function CR_error(code){const e=new Error(code);e.stockRepairCode=code;return e;}
function CR_message(code){
  const messages={AUTH:'请先在 GitHub 云备份中保存本机专用授权码。',TARGET:'补回记录只支持已配置的指定私有备份仓库。',BUSY:'正在进行云备份或补回操作，请完成后再试。',PACKAGE:'云端补回记录的格式或买卖记录不符合要求，原账本未改动。',SIZE:'补回文件超过 64 KB，原账本未改动。',EMPTY:'本机尚无可用的财务账本，请先确认打开的是原来记账的浏览器。',LOCAL:'本机财务账本无法完整校验，原账本未改动。',CONFLICT:'本机已有同名、同代码或同编号的不同股票记录。为避免重复，本次没有修改，请先核对记录。',CANCELLED:'授权、预览或设置已变更，请重新打开补回预览。',STORAGE:'本机保存遇到问题。请保留当前页面，检查存储空间并核对当前记录；必要时可导入备份恢复财务数据。',NETWORK:'无法读取私有补回文件，请检查网络、专用授权码和仓库权限。',UNKNOWN:'补回未完成，请重新打开预览并核对本机记录。'};

function CR_code(error){
  if(error&&error.stockRepairCode)return error.stockRepairCode;

}
function CR_normalize(value){return String(value==null?'':value).normalize('NFKC').replace(/\s+/g,'').toLowerCase();}
function CR_canonical(value){
  if(Array.isArray(value))return'['+value.map(CR_canonical).join(',')+']';
  if(value&&typeof value==='object')return'{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+CR_canonical(value[k])).join(',')+'}';
  return JSON.stringify(value);
}
function CR_validatePackage(raw){
  try{
    backupSafeTree(raw);
    if(!raw||typeof raw!=='object'||Array.isArray(raw)||Object.keys(raw).sort().join(',')!=='app,id,kind,schema,stock'||raw.app!=='财务管家'||raw.schema!==1||raw.kind!=='append-hidden-stock'||typeof raw.id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(raw.id))throw 0;
    const st=raw.stock;
    if(!st||typeof st!=='object'||Array.isArray(st)||st.hidden!==true||!CR_normalize(st.id)||!CR_normalize(st.name)||!Array.isArray(st.buyRecords)||!st.buyRecords.length||!Array.isArray(st.sellRecords)||!st.sellRecords.length||!Array.isArray(st.tpPlans))throw 0;
    validateFinanceBackup({items:[],stockAccount:{initialCapital:0,deposits:[],stocks:[st]}});
    const cal=F_calcStock(st);
    if(!cal.valid||cal.holdQty!==0||!['totalCost','totalSoldAmt','totalProfit','holdCost'].every(k=>Number.isFinite(cal[k]))||cal.sellProfits.length!==st.sellRecords.length||!cal.sellProfits.every(Number.isFinite))throw 0;
    return raw;
  }catch(e){throw CR_error('PACKAGE');}
}
function CR_readFinance(){
  let raw,f;
  try{raw=localStorage.getItem('finance_v1');}catch(e){throw CR_error('LOCAL');}
  if(!raw)throw CR_error('EMPTY');
  try{
    f=JSON.parse(raw);backupSafeTree(f);
    if(!f||typeof f!=='object'||Array.isArray(f)||!f.stockAccount||!Array.isArray(f.items)||!Array.isArray(f.stockAccount.stocks)||!Array.isArray(f.stockAccount.deposits))throw 0;
    validateFinanceBackup(f);
    if(Object.prototype.hasOwnProperty.call(f,'repairReceipts')&&!Array.isArray(f.repairReceipts))throw 0;
  }catch(e){throw CR_error('LOCAL');}
  if(!CB_hasLedgerData({}, {}, f))throw CR_error('EMPTY');
  return{raw,finance:f};
}
function CR_prepareAppend(pkg,sourceSha=''){
  CR_validatePackage(pkg);
  const current=CR_readFinance(),f=current.finance,st=pkg.stock;
  const id=CR_normalize(st.id),name=CR_normalize(st.name),code=CR_normalize(st.code);
  const matches=f.stockAccount.stocks.filter(s=>CR_normalize(s.id)===id||CR_normalize(s.name)===name||(code&&CR_normalize(s.code)===code));
  const cal=F_calcStock(st),cashDelta=cal.totalSoldAmt-cal.totalCost,profitDelta=cal.totalProfit;
  if(matches.length){
    if(matches.length===1&&CR_canonical(matches[0])===CR_canonical(st))return{alreadyApplied:true,next:f,cal,cashDelta:0,profitDelta:0};
    throw CR_error('CONFLICT');
  }
  const next={...f,stockAccount:{...f.stockAccount,stocks:[...f.stockAccount.stocks,JSON.parse(JSON.stringify(st))]},repairReceipts:[...(f.repairReceipts||[]),{id:pkg.id,stockId:st.id,appliedAt:new Date().toISOString(),sourceSha}]};
  try{backupSafeTree(next);validateFinanceBackup(next);}catch(e){throw CR_error('LOCAL');}
  return{alreadyApplied:false,next,cal,cashDelta,profitDelta};
}
function CR_decodeFile(file){
  if(!file||file.type!=='file'||file.path!==CR_REPAIR_PATH||file.encoding!=='base64'||!Number.isInteger(file.size)||file.size<1||file.size>CR_MAX_BYTES||typeof file.content!=='string'||file.content.length>Math.ceil(CR_MAX_BYTES/3)*4+4096||typeof file.sha!=='string'||!/^[a-f0-9]{40,64}$/i.test(file.sha))throw CR_error(file&&file.size>CR_MAX_BYTES?'SIZE':'PACKAGE');
  try{
    const base64=file.content.replace(/[\r\n]/g,'');
    if(!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(base64))throw 0;
    const binary=atob(base64);
    if(binary.length>CR_MAX_BYTES)throw CR_error('SIZE');
    if(binary.length!==file.size)throw 0;
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    return CR_validatePackage(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)));
  }catch(e){if(e&&e.stockRepairCode)throw e;throw CR_error('PACKAGE');}
}

  const money=n=>(n>=0?'+':'−')+'¥'+Math.abs(n).toFixed(2);
  add(pkg.stock.name+(pkg.stock.code?'（'+pkg.stock.code+'）':''),true);
  add('状态：已隐藏 · 已清仓 · '+pkg.stock.buyRecords.length+' 笔买入 / '+pkg.stock.sellRecords.length+' 笔卖出');
  pkg.stock.buyRecords.forEach(r=>add('买入 '+r.date+' · '+r.qty+' 股 × ¥'+r.price+' · 实付 ¥'+Number(r.amount).toFixed(2)));
  pkg.stock.sellRecords.forEach((r,i)=>add('卖出 '+r.date+' · '+r.qty+' 股 × ¥'+r.price+' · 实收 ¥'+Number(r.amount).toFixed(2)+' · 盈亏 '+money(result.cal.sellProfits[i])));
  add('此股票累计盈亏：'+money(result.cal.totalProfit));
  add('补回后账户可用资金变化：'+money(result.cashDelta)+'；累计盈亏变化：'+money(result.profitDelta));
  add('补回后可从“财务 → 股票账户 → 已隐藏股票 → 查看记录”查看，无需恢复显示。');
}
function CR_openRepair(){
  if(CR_openPromise)return CR_openPromise;
  if(CR_applyPromise)return Promise.resolve({ok:false,code:'BUSY'});
  const generation=++CR_generation;CR_pending=null;CR_mount();
  const run=async()=>{
    try{
      if(CR_repairBusy())throw CR_error('BUSY');
      const c=CB_readConfig(),revision=CB_revision;
      if(c.consent!==true||!CB_validToken(c.token)||!CB_validTarget(c.owner,c.repo))throw CR_error('AUTH');
      if(CB_target(c).toLowerCase()!==CR_REPAIR_TARGET.toLowerCase())throw CR_error('TARGET');
      CB_ensureCurrent(c,revision);
      const base='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo);
      const metadata=await CB_request(base,c,revision);
      const branch=CB_checkRepository(metadata,c);
      if(generation!==CR_generation)throw CR_error('CANCELLED');
      if(CR_repairBusy())throw CR_error('BUSY');
      const file=await CB_request(base+'/contents/'+CR_REPAIR_PATH+'?ref='+encodeURIComponent(branch),c,revision);
      if(generation!==CR_generation)throw CR_error('CANCELLED');
      CB_ensureCurrent(c,revision);
      const pkg=CR_decodeFile(file),result=CR_prepareAppend(pkg,file.sha);
      CR_pending={pkg,sha:file.sha,c,revision,generation,alreadyApplied:result.alreadyApplied};
      CR_renderPreview(pkg,result);CR_status(result.alreadyApplied?'本机已有完全相同的股票记录，无需重复补回。':'请核对以下记录，然后点击“补回这只股票”。');CR_buttonState();
      return{ok:true,alreadyApplied:result.alreadyApplied};
    }catch(e){const code=CR_code(e);if(generation===CR_generation){CR_pending=null;CR_status(CR_message(code));CR_buttonState();}return{ok:false,code};}
  };
  CR_openPromise=Promise.resolve().then(run).finally(()=>{CR_openPromise=null;});
  return CR_openPromise;
}
function CR_applyRepair(){
  if(CR_applyPromise)return CR_applyPromise;
  const pending=CR_pending;
  const commit=()=>{
    if(!pending||pending.generation!==CR_generation||CR_pending!==pending)throw CR_error('CANCELLED');
    if(CR_repairBusy())throw CR_error('BUSY');
    CB_ensureCurrent(pending.c,pending.revision);
    // Re-read immediately before the synchronous transaction. Never save stale finance globals.
    const result=CR_prepareAppend(pending.pkg,pending.sha);
    if(result.alreadyApplied)return{alreadyApplied:true};
    try{writeAppStorageTransaction({finance_v1:JSON.stringify(result.next)});}catch(e){throw CR_error('STORAGE');}
    return{alreadyApplied:false};
  };
  const run=async()=>{
    let committed=false;
    try{
      CR_status('正在保存本机财务恢复副本并补回记录…');
      const result=typeof navigator!=='undefined'&&navigator.locks&&typeof navigator.locks.request==='function'?await navigator.locks.request('fin-finance-repair-write',commit):commit();
      if(result.alreadyApplied){if(CR_pending===pending)pending.alreadyApplied=true;CR_status('本机已有完全相同的股票记录，无需重复补回。');return{ok:true,alreadyApplied:true};}
      committed=true;if(CR_pending===pending)pending.alreadyApplied=true;
      let displayOk=true;try{F_loadData();F_renderMain();}catch(e){displayOk=false;}
      CR_status('已补回本机隐藏股票记录，正在创建新的完整云备份…');
      let backup;
      try{CB_ensureCurrent(pending.c,pending.revision);backup=await CB_uploadBackup({automatic:false});}catch(e){backup={ok:false};}
      const message=backup&&backup.ok?'已补回隐藏股票记录，并已完成新的完整云备份。':'本机记录已补回，新的云备份尚未成功；请到 GitHub 云备份中点击“立即备份”。';
      CR_status(message+(displayOk?'':' 页面刷新未完成，请重新打开财务页。'));CB_showToast(message);
      return{ok:true,alreadyApplied:false,backup:backup||{ok:false},displayOk};
    }catch(e){const code=CR_code(e);CR_status(committed?'本机记录已保存，请重新打开财务页并检查云备份状态。':CR_message(code));return{ok:committed,code};}
  };
  CR_applyPromise=Promise.resolve().then(run).finally(()=>{CR_applyPromise=null;CR_buttonState();});CR_buttonState();
  return CR_applyPromise;
}

// Targeted gold reconciliation. Personal ledger data is read only from the private repository.
const GR_REPAIR_PATH='repairs/pending-gold.json';
let GR_pending=null,GR_openPromise=null,GR_applyPromise=null,GR_generation=0;
function GR_error(code){const e=new Error(code);e.goldRepairCode=code;return e;}
function GR_code(e){return e&&e.goldRepairCode||e&&e.stockRepairCode||CR_code(e);}
function GR_message(code){
  const messages={PACKAGE:'云端黄金明细格式不正确，本机数据未修改。',CONFLICT:'本机黄金记录与准备汇总时不同。为保留你的新修改，本次没有覆盖，请先完成一次云备份后再核对。',EMPTY:'本机没有找到对应黄金项目，请使用平时记账的手机浏览器。',BUSY:'正在进行云备份或记录整理，请完成后再试。',SIZE:'黄金明细文件过大，本机数据未修改。'};
  return messages[code]||CR_message(code);
}
function GR_validatePackage(raw){
  try{
    backupSafeTree(raw);
    if(!raw||typeof raw!=='object'||Array.isArray(raw)||Object.keys(raw).sort().join(',')!=='after,app,before,id,kind,schema'||raw.app!=='财务管家'||raw.schema!==1||raw.kind!=='reconcile-gold-item'||typeof raw.id!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(raw.id))throw 0;
    const a=raw.after,b=raw.before;
    if(!a||!b||a.group!=='gold'||b.group!=='gold'||!a.id||a.id!==b.id||a.name!==b.name||!Array.isArray(a.records)||!a.records.length||a.records.length>500||a.invested!==0)throw 0;
    validateFinanceBackup({items:[b],stockAccount:{initialCapital:0,deposits:[],stocks:[]}});
    validateFinanceBackup({items:[a],stockAccount:{initialCapital:0,deposits:[],stocks:[]}});
    // The package can reconcile cost/history only, never change a plan or project identity.
    const settings=x=>Object.fromEntries(Object.entries(x).filter(([k])=>k!=='invested'&&k!=='records'));
    if(CR_canonical(settings(a))!==CR_canonical(settings(b)))throw 0;
    a.records.forEach(r=>{
      if(r.type!=='deposit'||r.returned!==false||typeof r.grams!=='number'||!Number.isFinite(r.grams)||r.grams<=0||!Number.isFinite(r.amount)||r.amount<=0)throw 0;
      if(Object.prototype.hasOwnProperty.call(r,'fee')&&(typeof r.fee!=='number'||!Number.isFinite(r.fee)||r.fee<0||r.fee>r.amount))throw 0;
      if(Object.prototype.hasOwnProperty.call(r,'allocationMonth')&&(typeof r.allocationMonth!=='string'||!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.allocationMonth)))throw 0;
    });
    const sum=a.records.reduce((n,r)=>n+r.amount,0),grams=a.records.reduce((n,r)=>n+r.grams,0);
    if(!Number.isFinite(sum)||!Number.isFinite(grams))throw 0;
    return raw;
  }catch(e){throw GR_error('PACKAGE');}
}
function GR_prepareReplacement(pkg,sourceSha=''){
  GR_validatePackage(pkg);
  const current=CR_readFinance(),f=current.finance;
  const matches=f.items.map((item,index)=>({item,index})).filter(x=>x.item.id===pkg.before.id);
  if(!matches.length)throw GR_error('EMPTY');
  if(matches.length!==1)throw GR_error('CONFLICT');
  const {item,index}=matches[0];
  const oldTotal=F_getTotalInvested(item),newTotal=F_getTotalInvested(pkg.after);
  const grams=pkg.after.records.reduce((n,r)=>n+r.grams,0);
  if(CR_canonical(item)===CR_canonical(pkg.after))return{alreadyApplied:true,next:f,oldTotal,newTotal,grams};
  if(CR_canonical(item)!==CR_canonical(pkg.before))throw GR_error('CONFLICT');
  const items=f.items.slice();items[index]=JSON.parse(JSON.stringify(pkg.after));
  const next={...f,items,repairReceipts:[...(f.repairReceipts||[]),{id:pkg.id,itemId:item.id,appliedAt:new Date().toISOString(),sourceSha}]};
  try{backupSafeTree(next);validateFinanceBackup(next);}catch(e){throw GR_error('LOCAL');}
  return{alreadyApplied:false,next,oldTotal,newTotal,grams};
}
function GR_decodeFile(file){
  if(!file||file.type!=='file'||file.path!==GR_REPAIR_PATH||file.encoding!=='base64'||!Number.isInteger(file.size)||file.size<1||file.size>CR_MAX_BYTES||typeof file.content!=='string'||file.content.length>Math.ceil(CR_MAX_BYTES/3)*4+4096||typeof file.sha!=='string'||!/^[a-f0-9]{40,64}$/i.test(file.sha))throw GR_error(file&&file.size>CR_MAX_BYTES?'SIZE':'PACKAGE');
  try{
    const base64=file.content.replace(/[\r\n]/g,'');
    if(!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(base64))throw 0;
    const binary=atob(base64);if(binary.length!==file.size||binary.length>CR_MAX_BYTES)throw 0;
    return GR_validatePackage(JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(binary,c=>c.charCodeAt(0)))));
  }catch(e){throw GR_error('PACKAGE');}
}
function GR_status(text){const el=document.getElementById('gr-status');if(el)el.textContent=text;}
function GR_buttonState(){const b=document.getElementById('gr-apply');if(b)b.disabled=!GR_pending||GR_pending.alreadyApplied||!!GR_applyPromise;}
function GR_closeRepair(){GR_generation++;GR_pending=null;const el=document.getElementById('gr-overlay');if(el)el.remove();}
function GR_mount(){
  const old=document.getElementById('gr-overlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.id='gr-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:10010;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box';
  overlay.innerHTML='<section role="dialog" aria-modal="true" aria-labelledby="gr-title" style="background:#fff;color:#243142;border-radius:16px;padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-sizing:border-box"><h2 id="gr-title" style="font-size:20px;margin:0 0 12px">核对黄金明细</h2><p style="font-size:13px;line-height:1.7">将初始已投金额展开为实际买入记录，合并已有明细。每次买入单独保留，金额已包含已知手续费。</p><div id="gr-status" role="status" style="font-size:14px;line-height:1.7;margin:10px 0">正在读取私有备份仓库中的黄金明细…</div><div id="gr-preview"></div><p style="font-size:12px;color:#64748b;line-height:1.7">保存前会保留本机财务恢复副本，请先导出备份。</p><div style="display:flex;gap:10px;margin-top:16px"><button id="gr-apply" type="button" disabled style="flex:1;min-height:44px;border:0;border-radius:9px;background:#b67b13;color:white;padding:10px">更新手机黄金记录</button><button id="gr-close" type="button" style="min-height:44px;border:1px solid #cbd5e1;border-radius:9px;background:white;padding:10px 16px">关闭</button></div></section>';
  document.body.appendChild(overlay);document.getElementById('gr-close').onclick=GR_closeRepair;document.getElementById('gr-apply').onclick=GR_applyRepair;
}
function GR_renderPreview(pkg,result){
  const host=document.getElementById('gr-preview');if(!host)return;host.textContent='';
  const add=(text,bold=false)=>{const e=document.createElement(bold?'h3':'p');e.textContent=text;e.style.cssText='font-size:14px;line-height:1.7;margin:8px 0;overflow-wrap:anywhere';host.appendChild(e);};
  add(pkg.after.name,true);add(pkg.after.records.length+' 笔买入 · '+result.grams.toFixed(4)+' 克 · 合计 ¥'+result.newTotal.toFixed(2),true);
  const delta=result.newTotal-result.oldTotal;
  add('当前累计 ¥'+result.oldTotal.toFixed(2)+' → 核对后 ¥'+result.newTotal.toFixed(2)+'（'+(delta<0?'减少 ':delta>0?'增加 ':'变化 ')+Math.abs(delta).toFixed(2)+' 元）');
  pkg.after.records.forEach(r=>add(r.date+' · '+r.grams.toFixed(4)+' 克 · ¥'+r.amount.toFixed(2)+(r.allocationMonth&&r.allocationMonth!==r.date.slice(0,7)?' · 归属 '+r.allocationMonth:'')+(r.fee>0?' · 含手续费 ¥'+r.fee.toFixed(2):'')));
  add('更新后可在“财务 → 黄金”中查看完整明细及累计买入克数。');
}
function GR_isBusy(){return !!(GR_openPromise||GR_applyPromise);}
function GR_busy(){return !!(CB_uploadPromise||CR_openPromise||CR_applyPromise);}
function GR_openRepair(){
  if(GR_openPromise)return GR_openPromise;if(GR_applyPromise)return Promise.resolve({ok:false,code:'BUSY'});
  const generation=++GR_generation;GR_pending=null;GR_mount();
  const run=async()=>{
    try{
      if(GR_busy())throw GR_error('BUSY');
      const c=CB_readConfig(),revision=CB_revision;
      if(c.consent!==true||!CB_validToken(c.token)||!CB_validTarget(c.owner,c.repo))throw GR_error('AUTH');
      if(CB_target(c).toLowerCase()!==CR_REPAIR_TARGET.toLowerCase())throw GR_error('TARGET');
      CB_ensureCurrent(c,revision);
      const base='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo);
      const metadata=await CB_request(base,c,revision),branch=CB_checkRepository(metadata,c);
      if(generation!==GR_generation)throw GR_error('CANCELLED');if(GR_busy())throw GR_error('BUSY');
      const file=await CB_request(base+'/contents/'+GR_REPAIR_PATH+'?ref='+encodeURIComponent(branch),c,revision);
      if(generation!==GR_generation)throw GR_error('CANCELLED');CB_ensureCurrent(c,revision);
      const pkg=GR_decodeFile(file),result=GR_prepareReplacement(pkg,file.sha);
      GR_pending={pkg,sha:file.sha,c,revision,generation,alreadyApplied:result.alreadyApplied};
      GR_renderPreview(pkg,result);GR_status(result.alreadyApplied?'本机黄金明细已更新，无需重复操作。':'核对下列明细后，点击“更新手机黄金记录”。');GR_buttonState();
      return{ok:true,alreadyApplied:result.alreadyApplied};
    }catch(e){const code=GR_code(e);if(generation===GR_generation){GR_pending=null;GR_status(GR_message(code));GR_buttonState();}return{ok:false,code};}
  };
  GR_openPromise=Promise.resolve().then(run).finally(()=>{GR_openPromise=null;});return GR_openPromise;
}
function GR_applyRepair(){
  if(GR_applyPromise)return GR_applyPromise;const pending=GR_pending;
  const commit=()=>{
    if(!pending||pending.generation!==GR_generation||GR_pending!==pending)throw GR_error('CANCELLED');if(GR_busy())throw GR_error('BUSY');
    CB_ensureCurrent(pending.c,pending.revision);
    const result=GR_prepareReplacement(pending.pkg,pending.sha);

  };
  const run=async()=>{

      GR_status('正在保存恢复副本并更新黄金明细…');
      const result=typeof navigator!=='undefined'&&navigator.locks&&typeof navigator.locks.request==='function'?await navigator.locks.request('fin-finance-repair-write',commit):commit();

      committed=true;if(GR_pending===pending)pending.alreadyApplied=true;
      let displayOk=true;try{F_loadData();F_renderMain();}catch(e){displayOk=false;}

    }catch(e){const code=GR_code(e);GR_status(committed?'黄金明细已保存，请重新打开财务页并检查云备份状态。':GR_message(code));return{ok:committed,code};}
  };
  GR_applyPromise=Promise.resolve().then(run).finally(()=>{GR_applyPromise=null;GR_buttonState();});GR_buttonState();return GR_applyPromise;
}
